# Pi (https://pi.dev), a coding agent with no ACP of its own, served by `canoa-host` as an ACP agent: give this file as
# CANOA_CONFIG, or copy [host.tools.pi] into Canoa.cfg. Every line below is configuration; canoa-host has no code for Pi.
# See docs/host.md, "A command-line tool".

[host.tools.pi]
# Found as the system finds a command. On Windows npm's shim is pi.cmd; or name node, with Pi's dist/bundle/cli.js first in args.
program = "pi"
# RPC mode: one process holds the conversation, and takes each prompt as a line. --no-session keeps nothing on disk.
# permission-gate.ts is Pi's own example extension, which asks before rm -rf, sudo and chmod or chown 777. Give its
# absolute path: Pi takes a relative one from the session's working directory.
args = ["--mode", "rpc", "--no-session", "-e", "/path/to/@earendil-works/pi-coding-agent/examples/extensions/permission-gate.ts"]
runs = "session"
unasked = "Pi runs its read, bash, edit and write tools with your rights. It asks first only for bash commands holding rm -rf, sudo, or chmod or chown 777, and only with its permission-gate extension loaded; without it, Pi asks nothing."
prompt = { type = "prompt", message = "{prompt}" }
cancel = { type = "abort" }
# listen = "127.0.0.1:7804"
# working_roots = ["/home/me/src"]

[host.tools.pi.kinds]
bash = "execute"
powershell = "execute"
read = "read"
edit = "edit"
write = "edit"
grep = "search"
find = "search"
ls = "search"

# Each JSON line Pi writes is taken by the first rule whose `when` it matches; one matching none is passed over.

[[host.tools.pi.events]]
when = { type = "message_update", "assistantMessageEvent.type" = "text_delta" }
send = "text"
text = "{assistantMessageEvent.delta}"

[[host.tools.pi.events]]
when = { type = "message_update", "assistantMessageEvent.type" = "thinking_delta" }
send = "thought"
text = "{assistantMessageEvent.delta}"

[[host.tools.pi.events]]
when = { type = "tool_execution_start" }
send = "tool"
id = "{toolCallId}"
title = "{toolName} {args.command}{args.path}"
kind = "{toolName}"
input = "args"

[[host.tools.pi.events]]
when = { type = "tool_execution_end", isError = true }
send = "tool_done"
id = "{toolCallId}"
status = "failed"
output = "{result.content.0.text}"

[[host.tools.pi.events]]
when = { type = "tool_execution_end" }
send = "tool_done"
id = "{toolCallId}"
output = "{result.content.0.text}"

# The model failed: the turn ends with its words.
[[host.tools.pi.events]]
when = { type = "message_end", "message.stopReason" = "error" }
send = "failure"
text = "{message.errorMessage}"

# Pi refused the prompt before starting.
[[host.tools.pi.events]]
when = { type = "response", command = "prompt", success = false }
send = "end"
error = "{error}"

[[host.tools.pi.events]]
when = { type = "agent_settled", aborted = true }
send = "end"
stop = "cancelled"

[[host.tools.pi.events]]
when = { type = "agent_settled" }
send = "end"

# permission-gate's question goes to the person. Anything but their Allow is a refusal.
[[host.tools.pi.events]]
when = { type = "extension_ui_request", method = "select", "options.0" = "Yes", "options.1" = "No" }
send = "ask"
title = "{title}"
allow = { type = "extension_ui_response", id = "{id}", value = "Yes" }
reject = { type = "extension_ui_response", id = "{id}", cancelled = true }

[[host.tools.pi.events]]
when = { type = "extension_ui_request", method = "confirm" }
send = "ask"
title = "{title} {message}"
allow = { type = "extension_ui_response", id = "{id}", confirmed = true }
reject = { type = "extension_ui_response", id = "{id}", confirmed = false }

# Any other question an extension asks is answered cancelled, since the chat has no place to show it.
[[host.tools.pi.events]]
when = { type = "extension_ui_request", method = "select" }
send = "reply"
line = { type = "extension_ui_response", id = "{id}", cancelled = true }

[[host.tools.pi.events]]
when = { type = "extension_ui_request", method = "input" }
send = "reply"
line = { type = "extension_ui_response", id = "{id}", cancelled = true }

[[host.tools.pi.events]]
when = { type = "extension_ui_request", method = "editor" }
send = "reply"
line = { type = "extension_ui_response", id = "{id}", cancelled = true }
