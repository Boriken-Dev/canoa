# The installed copy: the defaults an application ships beside its program.
[desktop]
start_hidden = true
close_to_tray = true
[appearance]
look = "canoa"
brightness = "dark"
[sessions]
keep = 200
[usage]
limit_phrases = ["rate limit", "quota"]
[host.agents.alpha]
program = "claude-agent-acp"
args = ["--acp"]
listen = "127.0.0.1:7801"
[agents.Claude.profile]
model = "m1"
