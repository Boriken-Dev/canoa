# Boriken Dev Canoa — override with CANOA_CONFIG
[desktop]
start_hidden = false
close_to_tray = true
minimize_to_tray = false
[network]
prefer_webtransport = true
connect_timeout = 10
[assets]
cdn = "none"
# The list of sessions kept across runs, in sessions.json beside this file. What was said is kept only with keep_text.
[sessions]
keep = 200
keep_text = false
text_messages = 200
# What reaches you outside the window from a conversation you are not looking at. Each is on unless set false.
[notifications]
permission = true
question = true
finished = true
# Agents whose sessions start with full access: each request offering to allow once is allowed without asking. Off for all.
# [permissions]
# full_access = ["Claude"]
# The harness each name an agent reports stands for, beyond the built-in ones.
# [harnesses]
# "my-acp" = "My Harness"

# Profiles: what an agent starts with, in layers (built-in, overlays, yours, a trusted project's, the agent's, the
# session's); a later layer wins. See docs/configuration.md. Secrets come from from_env or from_file, never written here.
# [overlays]                         # AOS overlays: an overlay.cfg and conventional files (skills/, CONTEXT.md, env)
# team = "https://github.com/example/canoa-profiles.git@main#team"
# mine = { dir = "profiles/mine" }
# pinned = { source = "https://github.com/example/canoa-profiles.git@main#pinned", pin = "sha256:<64 hex digits>" }
# [profile]
# effort = "high"
# context = { file = "CONTEXT.md" }
# share_env = ["GITHUB_TOKEN"]        # variables overlays and projects may read
# [profile.env.GITHUB_TOKEN]
# from_env = "GITHUB_TOKEN"
# [profile.skills.review]
# path = "skills/review"
# [profile.mcp.docs]
# type = "http"
# url = "https://docs.example/mcp"
# [agents.Claude.profile]
# model = "claude-opus-4-1"

# What `canoa-host serve` offers to paired keys, on loopback. See docs/host.md.
# [host.agents.claude]
# program = "npx"
# args = ["-y", "@agentclientprotocol/claude-agent-acp@0.99.1"]
# listen = "127.0.0.1:7801"
# [host.providers.echo]
# library = "echo_provider.dll"
# provider = "echo_provider"
# listen = "127.0.0.1:7802"
# A provider written in Python, through Guatiao's source; relative paths are from this file's directory.
# [host.providers.python]
# source = "guatiao_source_py.dll"
# provider = "acp_echo_echo"
# listen = "127.0.0.1:7803"
# [host.providers.python.source_settings]
# dirs = ["python/echo"]
# paths = ["python/guatiao", "python/coqui_acp_provider"]
# A provider built from a configuration, checked against its schema.
# [host.providers.prefixed]
# library = "echo_provider.dll"
# provider = "prefixed_echo"
# [host.providers.prefixed.settings]
# prefix = "hi"
# A command-line tool with no ACP, by rules for its JSON lines: pi.cfg beside this file is Pi's whole entry.
# [host.tools.pi]
# program = "pi"
# args = ["--mode", "rpc", "--no-session"]
# runs = "session"
# unasked = "Pi runs its read, bash, edit and write tools with your rights, asking nothing."
# prompt = { type = "prompt", message = "{prompt}" }
# cancel = { type = "abort" }
