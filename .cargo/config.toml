# whisper.cpp is compiled by cmake when `whisper-rs-sys` builds. On Windows on ARM, ggml refuses cl.exe and needs clang-cl, Ninja
# (the Visual Studio generator picks cl.exe) and exceptions on for C++. The variables name the target, so no other platform sees them,
# and a value already in the environment wins. clang-cl and ninja must be on PATH (LLVM for Windows; Visual Studio's own copy of
# ninja is in Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja).
[env]
CC_aarch64_pc_windows_msvc = { value = "clang-cl", force = false }
CXX_aarch64_pc_windows_msvc = { value = "clang-cl", force = false }
CXXFLAGS_aarch64_pc_windows_msvc = { value = "-EHsc", force = false }
CMAKE_GENERATOR_aarch64_pc_windows_msvc = { value = "Ninja", force = false }
# clang-cl 22 rejects the pointer types libffi's Windows locks pass; the other C code of the build compiles with it as it is.
CFLAGS_aarch64_pc_windows_msvc = { value = "-Wno-error=incompatible-pointer-types", force = false }
