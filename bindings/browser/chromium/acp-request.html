<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canoa — Agents</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:15px system-ui;background:#101820;color:#e4f2f2}
    main{max-width:760px;margin:1.2rem auto;padding:0 1rem}label{display:block;margin:.8rem 0 .3rem}
    input[type=text],select{font:inherit;padding:.55rem;border-radius:.4rem;background:#263743;color:inherit;
      border:1px solid #587177;width:100%;box-sizing:border-box}
    button{font:inherit;padding:.6rem 1rem;border-radius:.4rem;background:#397e78;color:white;border:0;cursor:pointer;margin:.8rem .5rem 0 0}
    button.quiet{background:#3a4750}p{line-height:1.5;color:#c3d1d8}.warn{color:#f3be86}
    .site{font-weight:600;word-break:break-all;color:#fff}.theirs{font-style:italic;color:#c3d1d8}
    code{word-break:break-all;font-size:.85em}li{margin:.6rem 0}ul{list-style:none;padding:0}
    label.pick{display:flex;gap:.6rem;align-items:flex-start;margin:.6rem 0}fieldset{border:1px solid #3a4750;border-radius:.4rem;margin:1rem 0}
  </style>
</head>
<body>
<main id="main"></main>
<script type="module" src="acp-request.js"></script>
</body>
</html>
