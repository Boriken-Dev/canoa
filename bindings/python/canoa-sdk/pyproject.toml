[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canoa-sdk"
version = "0.0.0a1"
authors = [{ name = "jose-pr" }]
description = "Write a Canoa provider in Python: one base class per kind, a form from a dataclass"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# The binding a guatiao source puts on `sys.path` for a library: a provider is a `guatiao.provide.Provider`.
dependencies = ["guatiao"]

[project.optional-dependencies]
dev = ["build", "mypy", "pytest"]

[project.urls]
Homepage = "https://github.com/Boriken-Dev/canoa"
Issues = "https://github.com/Boriken-Dev/canoa/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/canoa_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
