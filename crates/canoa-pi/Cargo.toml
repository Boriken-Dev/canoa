[package]
name = "canoa-pi"
description = "Pi for Canoa: the coqui-acp provider, the Store recipe that installs it and the source preset that starts it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "canoa"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[dependencies]
canoa = { workspace = true, features = ["store", "vendor"] }
coqui-acp-api.workspace = true
coqui-acp-pi.workspace = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
