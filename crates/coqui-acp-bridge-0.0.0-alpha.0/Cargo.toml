# coqui-acp/crates/coqui-acp-bridge at 1b64a1c6e487374c40dcef8018cfc72ca4c1003e, with what it inherits written out.
bin = [{ name = "coqui-acp-bridge", path = "src/main.rs" }]
[package]
name = "coqui-acp-bridge"
description = "Put a stdio Agent Client Protocol agent on the network, under a proven peer identity"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "bridge", "websocket", "webtransport"]
categories = ["network-programming", "command-line-utilities"]
exclude = [".*", "*.local.*"]
publish = false
[dependencies]
url = "2.5"
[dependencies.clap]
version = "4"
features = ["derive"]
[dependencies.coqui-agentic-peer]
git = "https://github.com/Boriken-Dev/coqui-agentic-peer"
rev = "8dad1766ba1b925f2bee9ebd403805e42e6afc47"
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "984db3d54b73de10c7892b06fe269a259de2d1c5"
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681"
features = ["pin"]
[dependencies.coqui-peer-tls]
version = "=0.0.0-alpha.1"
features = ["generate", "ca"]
[dependencies.coqui-net-acl]
version = "=0.0.0-alpha.0"
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "1283116a22de6a8918faa3d0ebd78b8b6777ff0a"
default-features = false
[dependencies.coqui-transport-web]
git = "https://github.com/Boriken-Dev/coqui-transport-web"
rev = "c8df84264ff8e60907f5cedf269104e91d5add22"
features = ["websocket", "webtransport"]
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
[dependencies.serde_json]
version = "1"
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.rustix]
version = "1.1"
default-features = false
features = ["std", "process"]
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
win32job = "2.0.3"
[dev-dependencies]
[dev-dependencies.serde_json]
version = "1"
[dev-dependencies.rcgen]
version = "0.14"
default-features = false
features = ["ring", "pem"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
