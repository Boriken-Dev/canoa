[package]
name = "canoa-ffi"
description = "The Canoa host as a library inside an application: canoa commands run in-process, behind a small C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "host", "ffi"]
categories = ["external-ffi-bindings", "network-programming"]
exclude = [".*", "*.local.*"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The web app built in, as canoa-host's feature of that name: CANOA_WEB_DIST at build time.
web = ["canoa-host/web"]

[dependencies]
canoa-host.workspace = true
# The script engine the host carries: linked into this library, not into canoa-host.
guatiao-source-js.workspace = true
guatiao-bridge.workspace = true
guatiao-libffi.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Puts this process's standard error on a pipe, through a safe call; sets SIGPIPE aside, which rustix has no stable call for.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["stdio"] }
libc.workspace = true

# Puts this process's standard error on a pipe, and gives a windowed process a console nobody sees for what it starts.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

# The secret-prompt test plays the application: the link's binding and the sealing, and the scan for the value's forms.
[dev-dependencies]
coqui-acp = { workspace = true, features = ["secret"] }
data-encoding.workspace = true

# Whether a console has a window anybody can see, asked by a test's probe.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
