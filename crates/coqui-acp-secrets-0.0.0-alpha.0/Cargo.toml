# coqui-acp/crates/coqui-acp-secrets at 34de3e94dfe5f8a99e8da0b73884984ac538503a, with what it inherits written out.
[package]
name = "coqui-acp-secrets"
description = "The host side of secret prompts for an Agent Client Protocol agent: a handle store, the MCP tools that request, use and show a secret, the person's approval of every use, and output scrubbing"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "secrets", "mcp"]
categories = ["authentication", "development-tools"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[dependencies]
[dependencies.base64]
version = "0.22"
default-features = false
features = ["alloc"]
[dependencies.coqui-acp]
path = "../coqui-acp"
features = ["secret"]
[dependencies.data-encoding]
version = "2"
default-features = false
features = ["alloc"]
[dependencies.serde_json]
version = "1"
[dependencies.unicode-normalization]
version = "0.1"
default-features = false
features = ["std"]
[dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[dependencies.zeroize]
version = "1"
default-features = false
features = ["alloc"]
[target]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.rustix]
version = "1.1"
default-features = false
features = ["std", "process"]
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
[target."cfg(windows)".dependencies.win32job]
version = "2.0.3"
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
