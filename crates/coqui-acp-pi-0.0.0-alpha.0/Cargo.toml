# coqui-acp/crates/coqui-acp-pi at e7089d83577cb2c4ad8332350b18bb968ae217fd, with what it inherits written out.
example = [{ name = "pi_provider", crate-type = ["cdylib"] }]
[package]
name = "coqui-acp-pi"
description = "Pi as an Agent Client Protocol agent, in Rust: a driver for its RPC mode and an ACP agent on it, with no Node of its own and no adapter"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-acp"
homepage = "https://boriken-dev.github.io/coqui-acp/"
readme = "README.md"
keywords = ["acp", "agent", "pi", "rpc"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
history = ["dep:coqui-acp-history"]
[dependencies]
[dependencies.clap]
version = "4"
features = ["derive", "env"]
[dependencies.coqui-acp-api]
path = "../coqui-acp-api"
[dependencies.coqui-acp-harness]
path = "../coqui-acp-harness"
features = ["kind"]
[dependencies.coqui-acp-history]
path = "../coqui-acp-history"
optional = true
[dependencies.serde_json]
version = "1"
[dependencies.uuid]
version = "1"
default-features = false
features = ["v4"]
[dev-dependencies]
[dev-dependencies.coqui-acp]
path = "../coqui-acp"
[dev-dependencies.coqui-acp-claude]
path = "../coqui-acp-claude"
features = ["history"]
[dev-dependencies.coqui-acp-history]
path = "../coqui-acp-history"
[dev-dependencies.coqui-acp-api]
path = "../coqui-acp-api"
features = ["contract"]
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d"
default-features = false
features = ["json"]
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
