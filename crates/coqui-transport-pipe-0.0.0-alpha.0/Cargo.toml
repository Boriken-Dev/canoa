# coqui-transport-pipe/. at 1bf161f4d9349e9821d384859d3acdfb58aeae94, with what it inherits written out.
test = [{ name = "asynch", required-features = ["tokio"] }, { name = "channel", required-features = ["channel"] }]
[package]
name = "coqui-transport-pipe"
version = "0.0.0-alpha.0"
description = "Windows named pipes and Unix domain sockets as a coqui-peer transport, with the operating system's access control on by default"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-transport-pipe"
homepage = "https://boriken-dev.github.io/coqui-transport-pipe/"
keywords = ["named-pipe", "unix-socket", "peer", "ipc", "transport"]
categories = ["network-programming", "os"]
exclude = [".*", "*.local.*", "/tools/"]
publish = false
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[features]
default = []
tokio = ["dep:tokio", "coqui-peer/tokio", "coqui-transport/tokio"]
channel = []
[dependencies]
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "984db3d54b73de10c7892b06fe269a259de2d1c5"
[dependencies.tracing]
version = "0.1"
default-features = false
features = ["std"]
[dependencies.tokio]
version = "1"
default-features = false
features = ["net", "io-util", "time"]
optional = true
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "1283116a22de6a8918faa3d0ebd78b8b6777ff0a"
default-features = false
[target]
[target."cfg(windows)"]
[target."cfg(windows)".dependencies]
[target."cfg(windows)".dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"]
[target."cfg(windows)".dev-dependencies]
[target."cfg(windows)".dev-dependencies.windows-sys]
version = "0.61"
features = ["Win32_System_SystemServices"]
[target."cfg(unix)"]
[target."cfg(unix)".dependencies]
[target."cfg(unix)".dependencies.socket2]
version = "0.6"
default-features = false
features = ["all"]
[target."cfg(unix)".dependencies.libc]
version = "0.2"
default-features = false
[dev-dependencies]
toml = "1"
serde_json = "1"
tempfile = "3"
[dev-dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive", "serde"]
[dev-dependencies.coqui-peer-noise]
git = "https://github.com/Boriken-Dev/coqui-peer-noise"
rev = "3a5b30689780a6e6291af565ff6abbaae515973c"
[dev-dependencies.coqui-peer-tls]
git = "https://github.com/Boriken-Dev/coqui-peer-tls"
rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d"
features = ["generate", "tokio"]
[dev-dependencies.proptest]
version = "1"
default-features = false
features = ["std"]
[dev-dependencies.tokio]
version = "1"
default-features = false
features = ["macros", "net", "rt", "rt-multi-thread", "io-util", "time"]
