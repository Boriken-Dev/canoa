[package]
name = "canoa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A deny-by-default registry of services and client grants"
readme = "README.md"
exclude = [".*", "*.local.*"]
# Nothing consumes it yet: published when the native host does.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[features]
# The `program_store` kind: how a program is found, checked for updates and installed into a folder the host owns.
store = ["dep:coqui-acp-api", "dep:serde_json"]
# The `speech_provider` kind: audio streamed in, text and front matter out.
speech = ["dep:guatiao", "dep:coqui-acp-api"]
# The two providers that ship with it: a program the person names, and a speech-to-text HTTP endpoint the person names.
speech-builtin = ["speech", "dep:guatiao-intake", "dep:serde_json", "dep:ureq"]

[dependencies]
coqui-acp-api = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
guatiao = { workspace = true, optional = true }
guatiao-intake = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
guatiao-serde = { workspace = true }
coqui-acp-harness = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "store_kinds"
required-features = ["store"]

[[test]]
name = "speech_kinds"
required-features = ["speech-builtin"]

[[example]]
name = "speech_standin"
required-features = ["speech-builtin"]

[[test]]
name = "speech_output"
required-features = ["speech-builtin"]

[[example]]
name = "say_standin"
required-features = ["speech-builtin"]
