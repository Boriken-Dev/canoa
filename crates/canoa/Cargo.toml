[package]
name = "canoa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A deny-by-default registry of services and client grants"
readme = "README.md"
exclude = [".*", "*.local.*"]
# Nothing consumes it yet: published when the native host does.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[features]
# The `program_store` kind: how a program is found, checked for updates and installed into a folder the host owns.
store = ["dep:coqui-acp-api"]

[dependencies]
coqui-acp-api = { workspace = true, optional = true }

[dev-dependencies]
guatiao-serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "store_kinds"
required-features = ["store"]
