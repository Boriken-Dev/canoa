[package]
name = "canoa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A deny-by-default registry of services and client grants"
readme = "README.md"
exclude = [".*", "*.local.*"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# The `program_store` kind: how a program is found, checked for updates and installed into a folder the host owns.
store = ["dep:coqui-acp-api", "dep:data-encoding", "dep:serde_json", "dep:guatiao", "dep:guatiao-intake", "dep:sha2", "dep:sha1", "dep:rsa", "dep:ed25519-dalek"]
# The `agent_vendor` kind: who an agent's vendor is and how it is shown.
vendor = ["dep:coqui-acp-api"]
# The `usage_reader` kind: how an agent's own quota is read, which the host asks for.
usage = ["dep:coqui-acp-api"]
# The `profile_item` kind: one thing a profile may set, and what it does to a session.
profile-item = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake", "dep:regex"]
# The `secret_provider` kind: somewhere a secret comes from and goes to (the person's form, the system's store, a password manager).
secret = ["dep:guatiao", "dep:coqui-acp-api"]
# The `content_source` and `catalog_generator` kinds: a file or a tree obtained by URI, with the schemes providers register, and what turns it into a catalog.
content = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake", "dep:serde_json"]
# The `config_store` kind: where the host's configuration lives (canoa.cfg's layers, or another store).
config-store = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-serde", "dep:serde_json"]
# The settings_section kind: a page, or a group on a page, of the application Settings.
settings-section = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake"]
# The `approver` kind: somewhere an agent's permission request can be answered from (a rule, a phone).
approver = ["dep:coqui-acp-api", "dep:guatiao"]
# The `telemetry_exporter` kind: somewhere the host's traces, metrics and events go when the person turned that on, and OTLP's JSON for them.
telemetry = ["dep:coqui-acp-api", "dep:guatiao", "dep:serde_json"]
# The `panel_tab` kind: a kind of tab the application bottom panel can open (a terminal, a log).
panel-tab = ["dep:coqui-acp-api", "dep:guatiao"]
# The `file_viewer` kind: a way to show a file of some type in the application Files surface (an A2UI surface or a sealed page).
file-viewer = ["dep:coqui-acp-api", "dep:guatiao"]
# The `history_store` kind: where recorded conversations and the list of them are kept (SQLite, memory, or an extension's store).
history-store = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake", "dep:serde_json", "dep:data-encoding", "dep:coqui-acp-history", "dep:time"]
# The `notifier` kind: somewhere a notice about what happened on the host is sent (the desktop, a phone, an inbox).
notifier = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake"]
# The `session_service` kind: something a library runs for the sessions of a host and hands to them (an MCP server of its tools, its control methods).
session-service = ["dep:coqui-acp-api", "dep:guatiao", "dep:serde_json"]
# The `sdk_provider` kind: a vendor's client for an account type (chat, embeddings, rerank), over HTTP the host lends, and the built-in `server`.
sdk = ["dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake", "dep:serde_json"]
# The `speech_provider` kind: audio streamed in, text and front matter out.
speech = ["store", "dep:guatiao", "dep:coqui-acp-api"]
# The two providers that ship with it: a program the person names, and a speech-to-text HTTP endpoint the person names.
speech-builtin = ["speech", "network", "dep:guatiao-intake", "dep:serde_json"]
# The loopback HTTP server a host gives an agent: tools, or a local model's API, to a program of this user holding a bearer.
loopback = ["dep:httparse", "dep:serde_json", "dep:sha2", "dep:rustix"]
# The `environment` kind: a place an agent works (a remote host, a machine over SSH, a container), which hands out the spawner programs start through and serves files.
environment = ["dep:coqui-acp-api"]
# The `model_gateway` kind: a local model served to an agent, over the OpenAI or Anthropic API, for the session of an account.
gateway = ["dep:coqui-acp-api"]
# The account kind of an address that speaks one or several credential standards (an API gateway or proxy: an address, a key and the
# standards it speaks), the `account_provider` that makes it, and the pieces any account provider of such an address needs: a request
# through the person's network, the OpenAI model list, the sign-in form of a key.
api-gateway = ["network", "dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-serde", "dep:serde_json", "dep:percent-encoding"]
# How Canoa reaches the network: the system's proxy, proxy login, certificate verifier and client certificates, with the person's overrides.
network = ["dep:coqui-syshttp", "dep:data-encoding", "dep:ureq", "dep:rustls", "dep:tracing", "dep:url"]
# The `network_route` kind: how traffic leaves this computer (the system's choice, direct, a typed proxy, a PAC script, a program, or an extension's own), set for the host, an account or a profile's sessions.
network-route = ["network", "dep:coqui-acp-api", "dep:guatiao"]

[dependencies]
coqui-acp-api = { workspace = true, optional = true }
coqui-acp-history = { workspace = true, optional = true }
time = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
guatiao = { workspace = true, optional = true }
guatiao-intake = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
coqui-syshttp = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
guatiao-serde = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

# Proxy login with the logon session (Negotiate and NTLM through SSPI) needs no library on Windows; elsewhere it needs the system's GSSAPI
# library to build, so it is left out.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process", "net"], optional = true }

[target.'cfg(windows)'.dependencies]
coqui-syshttp = { workspace = true, features = ["negotiate"], optional = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
guatiao-serde = { workspace = true }
coqui-acp-harness = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "api_gateway"
required-features = ["api-gateway"]

[[test]]
name = "secret_kinds"
required-features = ["secret"]

[[test]]
name = "store_kinds"
required-features = ["store"]

[[test]]
name = "script_kinds"
required-features = ["store", "vendor", "secret", "profile-item", "settings-section", "panel-tab", "usage", "gateway", "environment", "config-store", "notifier", "file-viewer", "network-route", "approver", "telemetry"]

[[test]]
name = "speech_kinds"
required-features = ["speech-builtin"]

[[test]]
name = "speech_output"
required-features = ["speech-builtin"]

[[example]]
name = "say_standin"
required-features = ["speech-builtin"]

[[test]]
name = "form_vectors"
required-features = ["settings-section"]

[[test]]
name = "config_store_kinds"
required-features = ["config-store"]

[[test]]
name = "history_store"
required-features = ["history-store"]

[[test]]
name = "history_store_kinds"
required-features = ["history-store"]
