[package]
name = "canoa-office"
description = "Canoa's COM add-in for classic desktop Office: a DLL Word, Excel, PowerPoint and Outlook load, with a ribbon button and a task pane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["office", "com", "add-in", "windows"]
categories = ["os::windows-apis"]
exclude = [".*", "*.local.*"]
publish = false
build = "build.rs"

# The library is a DLL Office loads; the rlib lets the tests call its exports in their own process.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows-registry.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
percent-encoding.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# The registry, read by the registration test.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
