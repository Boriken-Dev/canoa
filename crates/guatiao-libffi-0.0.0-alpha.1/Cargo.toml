# guatiao/crates/guatiao-libffi at 1cf0f67f0354d18fbc5684a9a36177afbb20a0fa, with what it inherits written out.
[package]
name = "guatiao-libffi"
description = "libffi as a guatiao mechanism: function pointers for, and calls through, kind tables built at run time from a kind's description"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/Boriken-Dev/guatiao"
publish = true
license = "MPL-2.0"
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]
[lib]
name = "guatiao_libffi"
path = "src/lib.rs"
[dependencies]
libffi = "5.2"
[dependencies.guatiao]
path = "../guatiao"
version = "=0.0.0-alpha.1"
[dev-dependencies]
libloading = "0.8"
[dev-dependencies.guatiao]
path = "../guatiao"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
path = "../guatiao-serde"
features = ["json"]
[dev-dependencies.greeter_kind]
path = "../../examples/greeter_kind"
[lints]
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
