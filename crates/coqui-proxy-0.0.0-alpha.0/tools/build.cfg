[tools]
files = ["build.py", "public_api.py"]

[public_api]
packages = ["coqui-proxy"]
layout = "dir"
toolchain = "nightly-2026-09-21"

[deps]
# The orphan branch holds crates/ for Cargo.lock; main records the commit it was built with in the SDK lock.
branch = "deps"

[deps.pin]
lock = "tools/sdk.lock"
item = "deps crates"

[sdk]
lock = "tools/sdk.lock"
groups = ["core", "release", "deps"]
install = ["core"]

[sdk.system]
print = { linux = "sudo apt-get install -y build-essential libkrb5-dev libclang-dev podman", macos = "xcode-select --install", windows = "Install Visual Studio Build Tools with the Windows SDK and the MSVC tools for the host architecture (ARM64 needs the ARM64 tools too)." }

# Cargo.toml's rust-version is the minimum toolchain the lock names.
[[sdk.agree]]
item = "core rust"
file = "Cargo.toml"
pattern = '^rust-version = "([^"]+)"'
match = "prefix"

# The container build: the base images, the toolchain and rustup-init in packaging/container/Containerfile are held to the
# lock. `container build|test` reads the rows named here for the defaults it reports; tools/build.py help env lists the
# overrides of .env.
[container]
file = "packaging/container/Containerfile"
context = "."
name = "coqui-proxy"
base_item = "release rust-image"

[[sdk.agree]]
item = "release rust-image"
file = "packaging/container/Containerfile"
pattern = '^ARG BASE_IMAGE=docker\.io/library/rust:([^@\s]+)@sha256:[0-9a-f]{64}$'

[[sdk.agree]]
item = "release rust-image"
file = "packaging/container/Containerfile"
pattern = '^ARG BASE_IMAGE=docker\.io/library/rust:[^@\s]+@sha256:([0-9a-f]{64})$'
expect = "{sha256}"

[[sdk.agree]]
item = "core rust"
file = "packaging/container/Containerfile"
pattern = '^ARG RUST_VERSION=(\S+)$'
first = true

[[sdk.agree]]
item = "core rustup-init"
file = "packaging/container/Containerfile"
pattern = '^ARG RUSTUP_VERSION=(\S+)$'
first = true

[[sdk.agree]]
item = "core rustup-init"
file = "packaging/container/Containerfile"
pattern = '^ARG RUSTUP_INIT_SHA256_X86_64=([0-9a-f]{64})$'
platform = "linux-x64"
expect = "{sha256}"

[[sdk.agree]]
item = "core rustup-init"
file = "packaging/container/Containerfile"
pattern = '^ARG RUSTUP_INIT_SHA256_AARCH64=([0-9a-f]{64})$'
platform = "linux-arm64"
expect = "{sha256}"
