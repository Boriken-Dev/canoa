[package]
name = "canoa-litellm"
description = "LiteLLM for Canoa: an account kind for a LiteLLM proxy that provides the OpenAI and Anthropic APIs on one key, signs in through the proxy's SSO or takes a key, and reports the key's budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "canoa", "litellm"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[dependencies]
canoa = { workspace = true, features = ["api-gateway"] }
coqui-acp-api = { workspace = true, features = ["reader"] }
guatiao-serde.workspace = true
getrandom.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
sha2.workspace = true
data-encoding.workspace = true
time.workspace = true

[dev-dependencies]
coqui-acp-harness.workspace = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
