# coqui-agentic-peer/crates/coqui-agentic-peer at 161307f9ebc216a56e21d7407688baa80f442823, with what it inherits written out.
[package]
name = "coqui-agentic-peer"
description = "What an agent needs around a proven link: a home for the identity, finding a peer, the browser companion, MCP offered to a program"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-agentic-peer"
homepage = "https://boriken-dev.github.io/coqui-agentic-peer/"
readme = "README.md"
keywords = ["agent", "peer", "acp", "a2a", "mcp"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]
publish = false
[dependencies]
mdns-sd = "0.21"
serde_json = "1"
url = "2.5"
[dependencies.coqui-link]
git = "https://github.com/Boriken-Dev/coqui-link"
rev = "40123baab01440c0522a27baa7321a31892b3735"
features = ["sealed"]
[dependencies.coqui-peer-webcrypto]
git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto"
rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681"
[dependencies.coqui-transport]
git = "https://github.com/Boriken-Dev/coqui-transport"
rev = "2601da58de9cac8f635060e4746864e9b238c6c5"
default-features = false
[lints]
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
