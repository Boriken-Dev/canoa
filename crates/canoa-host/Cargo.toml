[package]
name = "canoa-host"
description = "Serves stdio ACP agents and Guatiao agent providers from canoa.cfg to paired keys, on loopback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "host", "guatiao"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[[bin]]
name = "canoa"
path = "src/main.rs"
# The library crate canoa documents itself under the same name: both would write target/doc/canoa.
doc = false

[features]
default = ["yaml", "json"]
# canoa.cfg may be written in YAML (`#!yaml` on its first line) or JSON (`#!json`); TOML always.
yaml = ["dep:serde-saphyr"]
json = []
# The web app built in: the site CANOA_WEB_DIST names at build time, served when [host.web] names no directory.
web = []
# Foundry Local's SDK, to run a model in this program's own process: it brings an HTTP client with the system's TLS library (OpenSSL on
# Linux), so it is asked for. Without it an account's model runs in the Foundry Local service the person runs.
foundry = ["canoa-foundry/sdk"]
# `canoa portal`: sign users in through the operating system's accounts and give each their own host, as themselves. Unix only;
# it links the system's libpam.
portal = ["dep:coqui-access", "dep:coqui-access-system", "dep:coqui-access-signin", "dep:coqui-access-kit", "dep:coqui-peer-tls", "dep:qrcode", "dep:tungstenite"]

[dependencies]
coqui-access = { workspace = true, optional = true }
coqui-access-system = { workspace = true, optional = true }
coqui-access-signin = { workspace = true, optional = true }
coqui-access-kit = { workspace = true, optional = true }
coqui-peer-tls = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
# The WebSocket handshake of the portal's relay, which checks the session before it upgrades; already in the graph through
# coqui-transport-web.
tungstenite = { workspace = true, optional = true, features = ["handshake"] }
canoa = { workspace = true, features = ["store", "speech-builtin", "network", "profile-item", "secret"] }
canoa-antigravity.workspace = true
canoa-claude.workspace = true
canoa-codex.workspace = true
canoa-foundry.workspace = true
canoa-grok.workspace = true
canoa-opencode.workspace = true
canoa-pi.workspace = true
clap.workspace = true
coqui-acp = { workspace = true, features = ["secret"] }
coqui-acp-api.workspace = true
coqui-acp-bridge.workspace = true
coqui-acp-secrets.workspace = true
coqui-acp-harness.workspace = true
coqui-acp-history.workspace = true
coqui-acp-hub.workspace = true
coqui-acp-provider.workspace = true
coqui-aos = { workspace = true, features = ["index", "embeddings"] }
coqui-a2a.workspace = true
coqui-agentic-peer.workspace = true
coqui-peer.workspace = true
coqui-peer-webcrypto.workspace = true
coqui-transport-pipe.workspace = true
coqui-transport-guatiao.workspace = true
coqui-builder.workspace = true
coqui-transport.workspace = true
coqui-transport-web.workspace = true
# The one-time token a provider's process proves its socket with.
getrandom.workspace = true
guatiao.workspace = true
guatiao-serde.workspace = true
# The speech providers' forms, which a settings screen draws.
guatiao-intake.workspace = true
httparse.workspace = true
# The address a remote source is dialed at; already in the graph through coqui-transport-web.
url.workspace = true
if-addrs.workspace = true
indexmap.workspace = true
percent-encoding.workspace = true
# The include and exclude filters of a knowledge index.
rustls.workspace = true
# The authority a session's proxy signs with when a profile has it carry a client certificate, and the roots the operating system
# trusts that a program is given with it.
rcgen.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
# An upload travels in base64; already in the graph (the web_peer example reads it too).
data-encoding.workspace = true
# An account's credential in the operating system's store, through keyring-core and the platform's store below.
keyring-core.workspace = true
# The file store's sealing, at the version the dependency graph already holds.
aes-gcm.workspace = true
# A credential's memory wiped once it is used.
zeroize.workspace = true
# An account's renewal compared with the stored copy by when each stops working.
time.workspace = true
# A secret typed at the terminal, with no echo.
rpassword.workspace = true
# The digest of a worktree's status listing, and of what the examples print; the version the dependency graph already holds.
sha2.workspace = true
toml.workspace = true
anycfg.workspace = true
serde-saphyr = { workspace = true, optional = true }
tracing.workspace = true
ureq.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true
tracing-subscriber.workspace = true

# Ends a provider's process group, through a safe call; the pseudo-terminal a terminal runs on; and passes the descriptors of a child's standard streams to the host's own
# process starter, over a socket (`spawn`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "net", "event", "fs", "system", "pty", "termios", "pipe", "stdio"] }

# The operating system's credential store: Secret Service on a Linux or other Unix desktop.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

# The Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

# A job object per provider process, which ends everything in it.
[target.'cfg(windows)'.dependencies]
win32job.workspace = true
# Windows' Credential Manager, whose credentials are made local to the machine and not roamed with the profile.
windows-native-keyring-store.workspace = true
# The user's registry keys an install may write, read to check a plan declared them.
windows-registry.workspace = true
# Whether this process runs elevated, through a safe call: the host forbids unsafe code. Small and old (winapi); one function.
is_elevated.workspace = true
# The process table, from a Toolhelp snapshot, and the pseudo-console a terminal runs on; the modules that are unsafe, and only for these
# calls. Already in the graph.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security"] }

# The stand-in Exchange of the mail tests completes a Negotiate exchange with the system's security package (test code only).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials"] }

[dev-dependencies]
# The keystore stand-in of the network tests names its identity source.
coqui-syshttp.workspace = true
# The peers the web_peer example plays the page of; already in the graph through coqui-acp-bridge.
coqui-peer-noise.workspace = true

# Fixtures the tests run, built by `cargo test` into target/<profile>/examples.
[[example]]
name = "echo_provider"
crate-type = ["cdylib"]

[[example]]
name = "echo_store"
crate-type = ["cdylib"]

[[example]]
name = "echo_source"
crate-type = ["cdylib"]

[[example]]
name = "sample_extension"
crate-type = ["cdylib"]

[[example]]
name = "stdio_agent"

[[example]]
name = "profile_agent"

[[example]]
name = "mcp_server"

[[example]]
name = "mcp_http"

[[example]]
name = "harness_standin"

[[example]]
name = "version_standin"

[[example]]
name = "web_peer"

[[example]]
name = "store_control"

[[example]]
name = "portal_standin_host"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

# The providers the portal loads from a path (Unix only, like the portal): cargo builds them beside the tests.
[target.'cfg(unix)'.dev-dependencies]
coqui-access-password-plugin.workspace = true
coqui-access-mtls-plugin.workspace = true
coqui-access-totp-plugin.workspace = true
coqui-access-signin = { workspace = true, features = ["test-support"] }
# The tests compute the code an authenticator app shows (RFC 6238) without the provider's help.
hmac = "0.13"
sha1 = { version = "0.11", default-features = false }
