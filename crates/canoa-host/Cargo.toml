[package]
name = "canoa-host"
description = "Serves stdio ACP agents and Guatiao agent providers from canoa.cfg to paired keys, on loopback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "host", "guatiao"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[[bin]]
name = "canoa"
path = "src/main.rs"
# The library crate canoa documents itself under the same name: both would write target/doc/canoa.
doc = false

[features]
default = []
# The web app built in: the site CANOA_WEB_DIST names at build time, served when [host.web] names no directory.
web = []

[dependencies]
canoa = { path = "../canoa" }
clap.workspace = true
coqui-acp.workspace = true
coqui-acp-api.workspace = true
coqui-acp-bridge.workspace = true
coqui-acp-claude.workspace = true
coqui-acp-codex.workspace = true
coqui-acp-harness.workspace = true
coqui-acp-provider.workspace = true
coqui-aos.workspace = true
coqui-agentic-peer.workspace = true
coqui-peer.workspace = true
coqui-peer-webcrypto.workspace = true
coqui-transport-pipe.workspace = true
coqui-web-channel.workspace = true
# The one-time token a provider's process proves its socket with.
getrandom = "0.4"
guatiao.workspace = true
guatiao-serde.workspace = true
httparse.workspace = true
indexmap.workspace = true
percent-encoding.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# An account's credential in the operating system's store, through keyring-core and the platform's store below.
keyring-core = "1"
# The file store's sealing, at the version the dependency graph already holds.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
# A credential's memory wiped once it is used.
zeroize = "1"
# An account's renewal compared with the stored copy by when each stops working.
time = { version = "0.3", default-features = false, features = ["parsing"] }
# A secret typed at the terminal, with no echo.
rpassword = "7"
# The digest of a worktree's status listing, and of what the examples print; the version the dependency graph already holds.
sha2 = { version = "0.10", default-features = false }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Ends a provider's process group, through a safe call.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

# The operating system's credential store: Secret Service on a Linux or other Unix desktop.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# The Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# A job object per provider process, which ends everything in it.
[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"
# Windows' Credential Manager, whose credentials are made local to the machine and not roamed with the profile.
windows-native-keyring-store = "1"

[dev-dependencies]
# The address a test client dials; already in the graph through coqui-web-channel.
url = "2.5"
# A certificate for the web app's HTTPS tests, at the version coqui-acp-bridge already builds.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The peers the web_peer example plays the page of, and its base64; already in the graph through coqui-acp-bridge.
coqui-peer-noise.workspace = true
data-encoding = { version = "2", default-features = false, features = ["std"] }

# Fixtures the tests run, built by `cargo test` into target/<profile>/examples.
[[example]]
name = "echo_provider"
crate-type = ["cdylib"]

[[example]]
name = "echo_source"
crate-type = ["cdylib"]

[[example]]
name = "stdio_agent"

[[example]]
name = "profile_agent"

[[example]]
name = "mcp_server"

[[example]]
name = "harness_standin"

[[example]]
name = "web_peer"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
