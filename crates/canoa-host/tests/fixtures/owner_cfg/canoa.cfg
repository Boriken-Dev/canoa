# The tables and keys of a person's canoa.cfg as the application writes them, with placeholder values, and the two agent
# entries of the built-in harnesses.
[desktop]
start_hidden = true
close_to_tray = true
minimize_to_tray = true
local_host = true

[network]
prefer_webtransport = true
connect_timeout = 10

[assets]
cdn = "https://cdn.example/assets"

[appearance]
look = "canoa"
brightness = "dark"
density = "compact"
follow_provider = false

[sessions]
keep = 20
keep_text = true
text_messages = 50

[notifications]
permission = true
question = true
finished = false

[attachments]
paste_as_file = 4000
embed_limit = 20000

[sources]
hidden = ["Example"]

[voice]
acknowledged = ["example"]
language = "en"
voice = "example"
output_voice = "example"

[secrets.providers.system]
provider = "system"

[host.agents.Claude]
harness = "claude"
title = "Claude"

[host.agents.Codex]
harness = "codex"
title = "Codex"
