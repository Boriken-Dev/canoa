# guatiao/crates/guatiao-bridge at 3163647ab70bc19bf24125d30e1dc1ee49b10f94, with what it inherits written out.
[package]
name = "guatiao-bridge"
description = "What every guatiao bridge to a language runtime shares: an engine trait, its thread, manifests and stamps, the glue to a source, and kinds served from their descriptions"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/Boriken-Dev/guatiao"
publish = true
license = "MPL-2.0"
readme = "README.md"
exclude = [".*", "*.local.*", "public-api.txt"]
[package.metadata]
[package.metadata.docs]
[package.metadata.docs.rs]
all-features = true
[lib]
name = "guatiao_bridge"
path = "src/lib.rs"
[features]
default = []
json = []
yaml = ["guatiao-serde/yaml"]
[dependencies]
[dependencies.guatiao]
path = "../guatiao"
version = "=0.0.0-alpha.1"
[dependencies.guatiao-serde]
path = "../guatiao-serde"
version = "=0.0.0-alpha.1"
default-features = false
features = ["json", "toml"]
[dependencies.anycfg]
git = "https://github.com/jose-pr/anycfg-rs"
rev = "bf71f7097a550037972a0651e8bd35747b8dcd11"
[dev-dependencies]
[dev-dependencies.guatiao]
path = "../guatiao"
features = ["provider", "load"]
[dev-dependencies.greeter_kind]
path = "../../examples/greeter_kind"
[dev-dependencies.guatiao-libffi]
path = "../guatiao-libffi"
[lints]
[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
