# coqui-access/providers/access/passkey/plugin at e0b452292306df7d70b3bb64670c16300bb415f3, with what it inherits written out.
[package]
name = "coqui-access-passkey-plugin"
description = "coqui-access-passkey as a library a host loads"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-access"
publish = false
exclude = [".*", "*.local.*"]
[lib]
crate-type = ["cdylib"]
[dependencies]
[dependencies.coqui-access]
path = "crates/coqui-access"
[dependencies.coqui-builder]
git = "https://github.com/Boriken-Dev/coqui-builder"
rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad"
features = ["derive"]
[dependencies.guatiao-builder]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
[dependencies.coqui-peer]
git = "https://github.com/Boriken-Dev/coqui-peer"
rev = "984db3d54b73de10c7892b06fe269a259de2d1c5"
[dependencies.coqui-access-passkey]
path = ".."
[dependencies.coqui-access-kit]
path = "crates/coqui-access-kit"
features = ["file"]
[dependencies.serde]
version = "1"
default-features = false
features = ["derive", "std"]
[dependencies.serde_json]
version = "1"
[dependencies.toml]
version = "1"
[dev-dependencies]
[dev-dependencies.tempfile]
version = "3"
[dev-dependencies.guatiao]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
features = ["provider", "load"]
[dev-dependencies.guatiao-serde]
git = "https://github.com/Boriken-Dev/guatiao"
rev = "3163647ab70bc19bf24125d30e1dc1ee49b10f94"
default-features = false
features = ["json"]
[dev-dependencies.passkey-authenticator]
version = "0.6"
features = ["testable"]
[dev-dependencies.passkey-client]
version = "0.6"
[dev-dependencies.passkey-crypto]
version = "0.1"
[dev-dependencies.passkey-types]
version = "0.6"
features = ["serialize_bytes_as_base64_string"]
[dev-dependencies.public-suffix]
version = "0.1"
[dev-dependencies.async-trait]
version = "0.1"
[dev-dependencies.tokio]
version = "1"
default-features = false
features = ["rt", "macros"]
[dev-dependencies.url]
version = "2"
[dev-dependencies.sha2]
version = "0.11.1"
default-features = false
[dev-dependencies.data-encoding]
version = "2.11"
