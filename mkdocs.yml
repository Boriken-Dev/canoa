site_name: Canoa
site_description: Interoperable agent connectivity, chat and browser MCP tools
site_url: https://boriken-dev.github.io/canoa/
repo_url: https://github.com/Boriken-Dev/canoa
repo_name: Boriken-Dev/canoa
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - ACP and MCP: protocols.md
  - ACP v2 Flutter client: acp-client.md
  - Interoperability: interop.md
  - Transport selection: transport.md
  - Namespaces and identifiers: naming.md
  - Desktop and configuration: configuration.md
  - The host: host.md
  - Offline deps branch: offline-deps.md
  - Browser MCP and DevTools: browser-mcp.md
  - Browser integration: browser.md
  - ACP permission requests: acp-permissions.md
  - User site adapters: site-adapters.md
  - Browser comparisons: browser-comparison.md
  - Roadmap: roadmap.md
  - Rust API: https://boriken-dev.github.io/canoa/rust/canoa/index.html

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
