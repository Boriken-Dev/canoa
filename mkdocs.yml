site_name: Canoa
site_description: Interoperable agent connectivity, chat and browser MCP tools
site_url: https://boriken-dev.github.io/canoa/
repo_url: https://github.com/Boriken-Dev/canoa
repo_name: Boriken-Dev/canoa
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  # The system font stack: the site asks Google Fonts for nothing.
  font: false
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Quick Start: index.md
  - User guide:
      - The window: guide/window.md
      - Permissions: guide/permissions.md
      - The Store: guide/store.md
      - Accounts: guide/accounts.md
      - Settings: guide/settings.md
      - The browser extension: guide/browser-extension.md
      - The Office add-in: guide/office-addin.md
      - The web app and the portal: guide/web-and-portal.md
  - Developers:
      - Overview: developers.md
      - Getting started: getting-started.md
      - Architecture: architecture.md
      - ACP and MCP: protocols.md
      - ACP v2 Flutter client: acp-client.md
      - Interoperability: interop.md
      - Transport selection: transport.md
      - Desktop and configuration: configuration.md
      - Words, symbols and brands: themes_and_brands.md
      - Providers written as scripts: script_providers.md
      - Views from agents and overlays: a2ui_views.md
      - The host: host.md
      - The portal: portal.md
      - One file per platform: portable.md
      - Offline deps branch: offline-deps.md
      - Browser MCP and DevTools: browser-mcp.md
      - Browser integration: browser.md
      - ACP permission requests: acp-permissions.md
      - User site adapters: site-adapters.md
      - Browser comparisons: browser-comparison.md
      - Roadmap: roadmap.md
      - Rust API: https://boriken-dev.github.io/canoa/rust/canoa/index.html

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

hooks:
  - tools/docs_brand.py
  - tools/docs_download.py
