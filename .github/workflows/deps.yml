name: Refresh deps branch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canoa-deps
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/flutter
      - run: flutter config --enable-windowing
      - name: Resolve Dart packages
        env:
          PUB_CACHE: /tmp/canoa_pub
        run: |
          cd app
          flutter pub get --enforce-lockfile
      - name: Check out deps
        run: |
          git fetch origin deps
          git worktree add -B deps "$RUNNER_TEMP/canoa-deps" origin/deps
          git -C "$RUNNER_TEMP/canoa-deps" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/canoa-deps" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Refresh the deps branch
        run: python tools/build.py deps refresh --deps "$RUNNER_TEMP/canoa-deps" --pub-cache /tmp/canoa_pub
      - name: Push cache
        run: git -C "$RUNNER_TEMP/canoa-deps" push origin deps
