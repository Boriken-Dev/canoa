name: Offline dependency verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: deps
          path: deps-cache
      - uses: ./.github/actions/flutter
      - run: flutter config --enable-windowing
      - name: The deps branch holds every lock
        run: python3 tools/build.py deps check --deps deps-cache
      - name: Resolve the Dart graph without network
        run: python3 ../tools/build.py --root .. offline run --deps ${{ github.workspace }}/deps-cache -- flutter pub get --offline --enforce-lockfile
        working-directory: app
      - name: Analyze against the mirrored packages
        run: python3 ../tools/build.py --root .. offline run --deps ${{ github.workspace }}/deps-cache -- flutter analyze --no-pub
        working-directory: app
