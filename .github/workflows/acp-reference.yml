name: ACP WSS reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test server dependencies
        working-directory: examples/acp-echo
        run: npm install --no-audit --no-fund
      - name: Test TLS, peer proof and ACP session lifecycle
        working-directory: examples/acp-echo
        run: npm test
