name: Browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser WebCrypto peer authentication tests
        run: node --test app/test/coqui_vendor.test.mjs
      - name: Chromium permission tests
        run: npm test
        working-directory: bindings/browser/chromium
