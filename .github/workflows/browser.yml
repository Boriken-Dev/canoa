name: Browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser peer authentication tests, both methods
        # A pairing desk's timers outlive its test.
        run: node --test --test-force-exit app/test/coqui_vendor.test.mjs app/test/canoa_peer_bridge.test.mjs
      - name: Chromium permission tests
        run: npm test
        working-directory: bindings/browser/chromium
