name: Browser
on:
  push:
    paths:
      - "bindings/browser/**"
      - ".github/workflows/browser.yml"
  pull_request:
    paths:
      - "bindings/browser/**"
      - ".github/workflows/browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chromium permission tests
        run: npm test
        working-directory: bindings/browser/chromium
