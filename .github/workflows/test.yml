name: Test
# On pushes and pull requests, on demand at any ref, and on a throwaway "ci-*" tag, deleted after its run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    env:
      # The site canoa's web feature builds in, which --all-features turns on.
      CANOA_WEB_DIST: ${{ github.workspace }}/crates/canoa-host/tests/site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
        env:
          CANOA_TEST_METHOD: noise
      # The host again under the other method: a WebCrypto home keeps serving the keys it paired.
      - run: cargo test -p canoa-host --all-features
        env:
          CANOA_TEST_METHOD: webcrypto
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
