name: Release

# A gate, so a first real release is not the first time this runs. Nothing here publishes: no crate or package of
# this workspace is released yet. It creates a source release from CHANGELOG.md and starts the docs deploy at the tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docs-gate:
    name: Build the documentation strictly
    runs-on: ubuntu-latest
    # Pages is enabled here as docs.yml enables it, so a first release does not meet a repository without it.
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      # Office.js, which the add-in carries, comes from the deps branch's mirror: only that folder is fetched.
      - uses: actions/checkout@v4
        with:
          ref: deps
          path: deps-cache
          sparse-checkout: cdn/officeapis.public.onecdn.static.microsoft
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material==9.6.22
      - name: Build Rust API
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
          # The site canoa's web feature builds in.
          CANOA_WEB_DIST: ${{ github.workspace }}/crates/canoa-host/tests/site
          CANOA_DEPS: ${{ github.workspace }}/deps-cache
      - run: mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The docs workflow owns every Pages deploy; the release does not wait for it. It starts after the release is published, since the
  # Download button of the Quick Start is written from the latest release's files.
  docs-deploy:
    name: Start the documentation deploy at the tag
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: Create source release
    needs: [test, docs-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n")
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: release_notes.md
