name: Desktop builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libx11-dev libxi-dev
      - name: Generate platform runner
        working-directory: app
        run: flutter create --org dev.boriken --platforms=${{ matrix.platform }} .
      - name: Resolve packages
        working-directory: app
        run: flutter pub get
      - name: Compile native app and tray integration
        working-directory: app
        run: flutter build ${{ matrix.platform }} --release
