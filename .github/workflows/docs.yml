name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "app/brand.json"
      - "app/lib/theme/look.dart"
      - "tools/docs_brand.py"
      - "tools/docs_download.py"
      - "overrides/**"
      - "README.md"
      - "crates/**"
      - "extensions/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canoa-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Office.js, which the add-in carries, comes from the deps branch's mirror: only that folder is fetched.
      - uses: actions/checkout@v4
        with:
          ref: deps
          path: deps-cache
          sparse-checkout: cdn/officeapis.public.onecdn.static.microsoft
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install documentation tools
        run: pip install mkdocs-material==9.6.22
      - name: Build Rust API
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
          # The site canoa's web feature builds in.
          CANOA_WEB_DIST: ${{ github.workspace }}/crates/canoa-host/tests/site
          CANOA_DEPS: ${{ github.workspace }}/deps-cache
      - name: Build documentation
        run: mkdocs build --strict
        env:
          # The Quick Start's Download button reads the latest release.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Add Rust API reference
        run: |
          mkdir -p site/rust
          cp -r target/doc/. site/rust/
          printf '%s' '<!doctype html><meta http-equiv="refresh" content="0;url=canoa/index.html">' > site/rust/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
