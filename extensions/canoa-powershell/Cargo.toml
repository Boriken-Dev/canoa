[package]
name = "canoa-powershell"
description = "PowerShell 7 for Canoa: the Store recipe that installs Microsoft's PowerShell releases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["canoa", "powershell", "store"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[dependencies]
canoa = { workspace = true, features = ["store"] }
coqui-acp-api.workspace = true
serde_json.workspace = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
