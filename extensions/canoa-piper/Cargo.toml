[package]
name = "canoa-piper"
description = "Piper for Canoa: its text-to-speech program and voices as a Store type, and the speech-output provider that reads text aloud with them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canoa", "text-to-speech", "piper"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[dependencies]
canoa = { workspace = true, features = ["store", "speech-builtin"] }
coqui-acp-api.workspace = true
guatiao.workspace = true
guatiao-intake.workspace = true
serde_json.workspace = true

[dev-dependencies]
coqui-acp-harness.workspace = true
sha2.workspace = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
