[package]
name = "canoa-codex"
description = "Codex for Canoa: the coqui-acp provider, the Store recipe that installs it and the source preset that starts it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["acp", "agent", "canoa"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Its git dependencies are unpublished: released once they are.
publish = false

[dependencies]
canoa = { workspace = true, features = ["store", "vendor"] }
coqui-acp-api.workspace = true
coqui-acp-harness.workspace = true
guatiao.workspace = true
guatiao-intake.workspace = true
coqui-acp-history.workspace = true
serde_json.workspace = true
coqui-acp-codex.workspace = true

[lints]
workspace = true
