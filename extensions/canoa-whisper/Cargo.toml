[package]
name = "canoa-whisper"
description = "Whisper for Canoa: one Store type for OpenAI's Whisper models read from Hugging Face, one download that both engines (Candle and whisper.cpp) run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canoa", "speech-to-text", "whisper"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[features]
default = ["host", "whispercpp"]
# The Store type, its models page and its source. Without it the crate is the `catalog` of models alone, which compiles to
# WebAssembly: the repositories a Hugging Face listing names and what checks each file.
host = ["canoa-candle/host", "dep:canoa", "dep:coqui-acp-api", "dep:guatiao", "dep:guatiao-intake", "dep:sha2"]
# whisper.cpp as the second engine: installing a model also writes the GGML file it reads. Without it the crate has no C or C++ to
# build, and the models run on Candle alone.
whispercpp = ["host", "dep:canoa-whispercpp"]

[dependencies]
canoa = { workspace = true, features = ["store", "speech"], optional = true }
canoa-candle.workspace = true
canoa-whispercpp = { workspace = true, optional = true }
coqui-acp-api = { workspace = true, optional = true }
guatiao = { workspace = true, optional = true }
guatiao-intake = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

[dev-dependencies]
coqui-acp-harness.workspace = true
half.workspace = true
safetensors.workspace = true

[lints]
workspace = true
