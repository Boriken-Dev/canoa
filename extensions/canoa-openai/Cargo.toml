[package]
name = "canoa-openai"
description = "OpenAI for Canoa: the speech-to-text service the accounts that hold an OpenAI API key can call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canoa", "openai", "speech-to-text"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[dependencies]
canoa = { workspace = true, features = ["speech", "speech-builtin", "sdk"] }
coqui-acp-api.workspace = true
guatiao.workspace = true
guatiao-intake.workspace = true

[dev-dependencies]
coqui-acp-harness.workspace = true

[lints]
workspace = true
