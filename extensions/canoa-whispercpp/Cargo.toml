[package]
name = "canoa-whispercpp"
description = "whisper.cpp for Canoa: its models as a Store type, and the speech-to-text provider that runs them inside the host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canoa", "speech-to-text", "whisper"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[dependencies]
canoa = { workspace = true, features = ["store", "speech"] }
coqui-acp-api.workspace = true
guatiao.workspace = true
guatiao-intake.workspace = true
serde_json.workspace = true
whisper-rs.workspace = true

[dev-dependencies]
coqui-acp-harness.workspace = true
coqui-acp-api.workspace = true
sha2 = { workspace = true }
guatiao.workspace = true

[lints]
workspace = true
