[package]
name = "canoa-whispercpp"
description = "whisper.cpp for Canoa: the speech-to-text provider that runs a Whisper model inside the host, and the converter that writes the file it reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canoa", "speech-to-text", "whisper"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# Canoa itself is not published yet.
publish = false

[dependencies]
canoa = { workspace = true, features = ["store", "speech"] }
coqui-acp-api.workspace = true
guatiao.workspace = true
guatiao-intake.workspace = true
serde_json.workspace = true
whisper-rs.workspace = true
whisper-rs-sys.workspace = true
safetensors.workspace = true
half.workspace = true
memmap2.workspace = true

[dev-dependencies]
coqui-acp-harness.workspace = true
coqui-acp-api.workspace = true
guatiao.workspace = true

[lints]
workspace = true
