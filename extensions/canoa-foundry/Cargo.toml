[package]
name = "canoa-foundry"
description = "Foundry Local for Canoa: the OpenAI and Anthropic APIs over a local model, translated to chat completions, and the engine that runs them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "canoa", "local-models"]
categories = ["development-tools"]
exclude = [".*", "*.local.*"]
# The Foundry Local SDK it runs on is a registry crate, but Canoa itself is not published yet.
publish = false

[features]
# `daemon` is the default so a build talks to the person's running Foundry Local service without pulling the heavier native `sdk` stack.
default = ["daemon"]
# The engine over the Foundry Local service the person runs, by loopback HTTP.
daemon = ["dep:ureq", "canoa/network"]
# The engine over the Foundry Local Rust SDK, in this process. It brings the SDK's own dependencies (an async runtime and an HTTP
# client with the system's TLS library: OpenSSL on Linux), which the translations do not need.
sdk = ["dep:foundry-local-sdk", "dep:tokio"]

[dependencies]
canoa = { workspace = true, features = ["store", "gateway", "loopback"] }
coqui-acp-api.workspace = true
guatiao.workspace = true
guatiao-intake.workspace = true
guatiao-serde.workspace = true
getrandom.workspace = true
serde_json.workspace = true
data-encoding.workspace = true
tracing.workspace = true
ureq = { workspace = true, optional = true }
foundry-local-sdk = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
coqui-acp-harness.workspace = true

[lints]
workspace = true
