# whisper-rs-sys 0.15.0 (Unlicense, codeberg.org/tazz4843/whisper-rs) with whisper.cpp v1.9.6 (MIT, github.com/ggml-org/whisper.cpp)
# in place of the 1.8.3 the crate carries. Only what compiles is here: no models, tests, examples or pre-generated bindings, and no
# GPU backend (the crate's cuda, hipblas, metal, vulkan and intel-sycl features are not usable from this copy). The source is
# the release tarball of the tag, whose commit is 96ec4d9823e9d0211944172da35f9f29134af990 and whose SHA-256 is
# 7ab15dc88022d2425ad94dcffd8abbf1b6d7018089b4e48d6b40780738e0b445. build.rs reads the version from the
# WHISPER_VERSION_* lines, which 1.9 uses in place of `project(... VERSION ...)`.
[package]
edition = "2021"
rust-version = "1.88.0"
name = "whisper-rs-sys"
version = "0.15.0"
build = "build.rs"
links = "whisper"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings for whisper.cpp (FFI bindings)"
documentation = "https://docs.rs/whisper-rs-sys"
readme = false
license = "Unlicense"
repository = "https://codeberg.org/tazz4843/whisper-rs"

[features]
coreml = []
cuda = []
force-debug = []
hipblas = []
intel-sycl = []
metal = []
openblas = []
openmp = []
vulkan = []

[lib]
name = "whisper_rs_sys"
path = "src/lib.rs"

[build-dependencies.bindgen]
version = "0.72"

[build-dependencies.cfg-if]
version = "1"

[build-dependencies.cmake]
version = "0.1"

[build-dependencies.fs_extra]
version = "1.3"

[build-dependencies.semver]
version = "1.0"

[workspace]
