<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Canoa</title>
  <!-- A Taíno dugout canoe with a paddle crossing it. The hull is cut where the shaft crosses it and along
       the spiral; lib/theme/canoa_mark.dart draws the same paths, without the paddle below 20 px and
       without the spiral below 64 px. -->
  <defs>
    <mask id="carved" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <path id="hull" fill="#fff" d="M 3.5 18 C 9 27 17 30 30 30 C 43 30 51 28 55 23 C 58 19 59 13 59.5 6 L 63.5 6 C 64.5 27 56 46 32 46 C 15 46 4 37 0 20 Z"/>
      <path id="cut" fill="#000" d="M 34.1 14.8 L 18.2 47.7 L 25 51 L 40.9 18.2 Z"/>
      <path id="spiral" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round" d="M 46.6 36 C 46.7 36.3 46.6 36.9 46 37.1 C 45.4 37.3 44.5 36.9 44.3 36 C 44.1 35.1 44.8 33.9 46 33.7 C 47.2 33.5 48.7 34.5 48.9 36 C 49.1 37.5 47.8 39.3 46 39.4 C 44.2 39.6 42.2 38.1 42 36 C 41.8 33.9 43.6 31.6 46 31.4"/>
    </mask>
  </defs>
  <g fill="#3DAFA1">
    <rect width="64" height="64" mask="url(#carved)"/>
    <path id="paddle" d="M 43.3 0.2 L 20.9 46.4 C 19.4 49.6 16.4 48.2 14.8 51.4 C 12.3 56.6 14.7 61.3 15 63 C 16.5 62.2 21.7 61.1 24.2 56 C 25.8 52.7 22.8 51.3 24.4 48 L 46.7 1.8 Z"/>
  </g>
</svg>
