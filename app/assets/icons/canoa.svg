<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Canoa</title>
  <!-- A Taíno dugout canoe with a paddle crossing it. The hull is cut where the shaft crosses it and along
       the spiral; lib/theme/canoa_mark.dart draws the same paths, without the paddle below 20 px and
       without the spiral below 64 px. Below 20 px the hull is also stroked
       data-small-weight units wide, round-joined, so it keeps its depth. -->
  <defs>
    <mask id="carved" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <path id="hull" fill="#fff" data-small-weight="3" d="M 2 23 C 5 27 9 30 15 30 L 49 30 C 55 30 59 27 60.5 17 L 63.5 17 C 64.5 31 59 41 49 41.5 C 38 42.5 26 42.5 15 41.5 C 6 40.5 1 32 0 24 Z"/>
      <path id="cut" fill="#000" d="M 34.1 14.8 L 19.2 45.5 L 26.1 48.8 L 40.9 18.2 Z"/>
      <path id="spiral" fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round" d="M 47.1 35.9 C 47.3 36.2 47.1 36.9 46.5 37.1 C 45.9 37.4 44.8 36.9 44.6 35.9 C 44.4 34.9 45.2 33.5 46.5 33.3 C 47.8 33.1 49.5 34.2 49.8 35.9 C 50 37.6 48.6 39.6 46.5 39.8 C 44.4 40.1 42.1 38.3 41.9 35.9"/>
    </mask>
  </defs>
  <g fill="#3DAFA1">
    <rect width="64" height="64" mask="url(#carved)"/>
    <path id="paddle" d="M 43.3 0.2 L 21.8 44.5 C 20 48.4 16.6 46.8 14.8 50.6 C 12.1 56.1 14.7 61.3 15 63 C 16.5 62.2 22.2 61 24.8 55.5 C 26.7 51.6 23.4 50 25.3 46.2 L 46.7 1.8 Z"/>
  </g>
</svg>
