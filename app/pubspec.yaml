name: canoa
description: Canoa multi-session agent chat for desktop and web.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  coqui_acp:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      path: bindings/dart/coqui_acp
      ref: 7f753632e040a0e0240c45a20c769f57b91a8d4a
  coqui_web:
    git:
      url: https://github.com/Boriken-Dev/coqui-web.git
      path: bindings/dart/coqui_web
      ref: 60faa0c8a50d0cd8b5ee49f16289bbce6a461a2b
  flutter_markdown_plus: ^1.0.12
  toml: ^0.18.0
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/canoa_tray.png
