name: canoa
description: Canoa multi-session agent chat for desktop and web.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  coqui_acp:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      path: bindings/dart/coqui_acp
      ref: 5a19365d7eb48acde352126c12a0c3578a51bb8f
  # Agent overlays: reading, validating, digests, composition and the environment, shared with the other consumers.
  coqui_aos:
    git:
      url: https://github.com/Boriken-Dev/coqui-aos.git
      path: dart
      ref: 6c476c4553c9b195502cb505a89d50e27cb85afd
  coqui_web:
    git:
      url: https://github.com/Boriken-Dev/coqui-web.git
      path: bindings/dart/coqui_web
      ref: 445007acb04f1b11f8f0f7c9fcf104f694189a2b
  # The host, as a library inside the desktop app: builds crates/canoa-ffi with it.
  canoa_native:
    path: native
  crypto: ^3.0.6
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  local_notifier: ^0.1.6
  markdown: ^7.3.1
  url_launcher: ^6.3.1
  pasteboard: ^0.5.0
  flutter_markdown_plus: ^1.0.12
  toml: ^0.18.0
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.0
  file_selector_platform_interface: ^2.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/canoa_tray.png
    - assets/icons/canoa.ico
  # Roboto is the web build's default family; CanvasKit fetches it from fonts.gstatic.com unless the app declares it.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-regular.ttf
        - asset: assets/fonts/Roboto-italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-bold.ttf
          weight: 700
