name: canoa
description: Canoa multi-session agent chat for desktop and web.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Sibling checkouts until the repositories are published; then a git dependency pinned to a commit.
  coqui_acp:
    path: ../../coqui-acp/bindings/dart/coqui_acp
  coqui_web:
    path: ../../coqui-web/bindings/dart/coqui_web
  toml: ^0.18.0
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/canoa_tray.png
