name: canoa
description: Canoa multi-session agent chat for desktop and web.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  coqui_acp:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      path: bindings/dart/coqui_acp
      ref: 6f62c9b85804d4f78c54b4070f26ba4b3ef6bfa4
  coqui_web:
    git:
      url: https://github.com/Boriken-Dev/coqui-web.git
      path: bindings/dart/coqui_web
      ref: 445007acb04f1b11f8f0f7c9fcf104f694189a2b
  crypto: ^3.0.6
  file_selector: ^1.1.0
  flutter_markdown_plus: ^1.0.12
  toml: ^0.18.0
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.0
  file_selector_platform_interface: ^2.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/canoa_tray.png
