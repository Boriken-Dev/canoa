name: canoa
description: Canoa multi-session agent chat for desktop and web.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.15.0-173.0.dev <4.0.0"
  flutter: ">=3.51.0-1.0.pre-291"

dependencies:
  flutter:
    sdk: flutter
  coqui_acp:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      path: bindings/dart/coqui_acp
      ref: 0244aca97b7d779fc00bc0f8103e4f73fcc25640
  # The chat's model and widgets, from the same commit as coqui_acp, which they depend on by path.
  coqui_acp_chat:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      path: bindings/dart/coqui_acp_chat
      ref: 0244aca97b7d779fc00bc0f8103e4f73fcc25640
  coqui_acp_chat_ui:
    git:
      url: https://github.com/Boriken-Dev/coqui-acp.git
      path: bindings/dart/coqui_acp_chat_ui
      ref: 0244aca97b7d779fc00bc0f8103e4f73fcc25640
  # Agent overlays: reading, validating, digests, composition and the environment, shared with the other consumers.
  coqui_aos:
    git:
      url: https://github.com/Boriken-Dev/coqui-aos.git
      path: dart
      ref: 169125d3bfcb1b2cb1c3b33b297e373f2930c54a
  coqui_transport_web:
    git:
      url: https://github.com/Boriken-Dev/coqui-transport-web.git
      path: bindings/dart/coqui_transport_web
      ref: 1e19611126472e8dc47c0e640bae2b86a7e6d713
  # The host, as a library inside the desktop app: builds crates/canoa-ffi with it.
  canoa_native:
    path: native
  crypto: ^3.0.6
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  local_notifier: ^0.1.6
  markdown: ^7.3.1
  url_launcher: ^6.3.1
  pasteboard:
    path: third_party/pasteboard
  flutter_markdown_plus: ^1.0.12
  toml: ^0.18.0
  # canoa.cfg may be written in YAML (its first line says #!yaml).
  yaml: ^3.1.2
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  web_socket_channel: ^3.0.3
  # The browser's WebCrypto and IndexedDB, for the web peer bridge.
  web: ^1.1.1
  # The terminal surface's emulator and view (pure Dart, no dart:io or dart:html, so the web build has it too).
  # A commit that opens the terminal's text input on the view it is drawn in (a window of the web app is a view): take the release
  # that contains it once one is published.
  xterm2:
    git:
      url: https://github.com/SoFluffyOS/xterm2.git
      ref: eaa4b8b103f740a2745a9ec43dd7c7446dcd72e6
  # Dictation through the operating system's own speech service (Windows, macOS); no model or cloud service ships with the app.
  speech_to_text: ^7.5.0
  record: ^7.2.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.0
  file_selector_platform_interface: ^2.7.0
  flutter_lints: ^6.0.0

# speech_to_text's Windows plugin never asked SAPI for the phrase being spoken and lost a phrase still in the recognizer when
# dictation stopped; this copy of it (see its README) delivers both.
dependency_overrides:
  speech_to_text_windows:
    path: third_party/speech_to_text_windows

flutter:
  uses-material-design: true
  assets:
    - assets/icons/canoa_tray.png
    - assets/icons/canoa.ico
  # Roboto is the web build's default family; CanvasKit fetches it from fonts.gstatic.com unless the app declares it.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-regular.ttf
        - asset: assets/fonts/Roboto-italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-bold.ttf
          weight: 700
    # The terminal draws one glyph a cell, so it needs a font whose glyphs share one width; a page has no system monospace.
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.otf
        - asset: assets/fonts/SourceCodePro-It.otf
          style: italic
        - asset: assets/fonts/SourceCodePro-Bold.otf
          weight: 700
        - asset: assets/fonts/SourceCodePro-BoldIt.otf
          weight: 700
          style: italic
