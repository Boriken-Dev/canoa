<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canoa</title>
    <!-- Office.js is loaded from the head, from Microsoft's own address; the host's policy allows that origin on this page only. -->
    <script src="@OFFICE_JS@"></script>
    <style>
      html, body { height: 100%; margin: 0; background: #101820; color: #e6eef2; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; font-size: 12px; background: #17232d; }
      #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button { font: inherit; color: inherit; background: #24394a; border: 1px solid #3a5469; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
      iframe { flex: 1; width: 100%; border: 0; }
      #ask { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #3a2f12; border-bottom: 1px solid #6b5a22; font-size: 12px; }
      #ask[hidden] { display: none; }
      #ask-text { flex: 1; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="status" role="status">Loading Canoa</span>
      <button id="signin" type="button" hidden>Sign in</button>
      <button id="start" type="button" hidden>Start Canoa</button>
    </div>
    <div id="ask" role="alertdialog" aria-labelledby="ask-text" hidden>
      <span id="ask-text"></span>
      <button id="ask-yes" type="button">Allow</button>
      <button id="ask-no" type="button">Don't allow</button>
    </div>
    <iframe id="canoa" title="Canoa"></iframe>
    <script type="module" src="taskpane.js"></script>
  </body>
</html>
