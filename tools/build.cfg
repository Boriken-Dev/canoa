# Settings of tools/build.py, the file copied from Boriken-Dev/agent-overlays (`python tools/build.py help config`).
[tools]
files = ["build.py"]

[deps]
branch = "deps"
checkout_env = ["CANOA_DEPS"]

# One folder per lock: two locks may need two sources of one package.
[[deps.vendor]]
folder = "crates"
lock = "Cargo.lock"

[[deps.vendor]]
folder = "crates-web_noise"
lock = "app/web_noise/Cargo.lock"

[[deps.vendor]]
folder = "crates-web_whisper"
lock = "app/web_whisper/Cargo.lock"

# The command line that links the web app's Noise and Whisper wasm: `sdk install` builds it from this folder.
[[deps.vendor]]
folder = "crates-wasm-bindgen-cli"
item = "app wasm-bindgen-cli"
bin = "wasm-bindgen"

[deps.pub]
lock = "app/pubspec.lock"
git = "checkout"
# leanflutter's desktop packages (the tray and the window): a desktop build needs all of them, whichever pub resolves.
require = [
  "tray_manager", "window_manager", "screen_retriever", "screen_retriever_linux", "screen_retriever_macos",
  "screen_retriever_platform_interface", "screen_retriever_windows", "menu_base",
]
# What those packages link on Linux, which no pub cache can carry.
system = ["libayatana-appindicator3-dev", "libgtk-3-dev", "libx11-dev", "libxi-dev"]

[deps.cdn]
index = "tools/cdn_files.json"

# Office.js: one whole commit of its repository, unmodified, as its licence requires. tools/office_js.py pins the carried subset.
[[deps.tree]]
name = "office-js"
repo = "OfficeDev/office-js"
pin = "tools/office_js.json"
path = "cdn/office-js"
license = "LICENSE.md"

[flutter]
app_dir = "app"
commit_items = ["app flutter", "app flutter-upstream"]
sdk_item = "app flutter"
engine_release = "https://github.com/Boriken-Dev/flutter/releases/download/engine-{engine}"
precache = ["web", "windows", "linux"]

[flutter.fonts]
host = "fonts.gstatic.com"

[sdk]
groups = ["core", "app"]
install = ["core"]

[[sdk.agree]]
item = "core rust"
file = "Cargo.toml"
pattern = '^rust-version = "([^"]+)"'
match = "prefix"

[[sdk.agree]]
item = "app flutter"
file = "tools/flutter.pin"
pattern = '^FLUTTER_COMMIT=([0-9a-f]{40})$'

[[sdk.agree]]
item = "app flutter-upstream"
file = "tools/flutter.pin"
pattern = '^FLUTTER_UPSTREAM=([0-9a-f]{40})$'

[[sdk.agree]]
item = "app flutter-version"
file = "tools/flutter.pin"
pattern = '^FLUTTER_VERSION=(\S+)$'

[[sdk.agree]]
item = "app flutter-engine"
file = "tools/flutter.pin"
pattern = '^FLUTTER_ENGINE=([0-9a-f]{40})$'

# The image tag is the first ten digits of the Flutter commit.
[[sdk.agree]]
item = "app flutter"
file = "packaging/container/Containerfile"
pattern = '^ARG FLUTTER_IMAGE_TAG=([0-9a-f]+)$'
expect = "{version:.10}"

[[sdk.agree]]
item = "app wasm-bindgen-cli"
file = "app/web_noise/Cargo.toml"
pattern = '^wasm-bindgen = "=([^"]+)"'
