# Every tool a build of Canoa needs, and the only file to trust for them.
#
#   <group> <name> <version> <os-arch|any> <sha256|-> <url|->
#
# Space separated, one item a line, # for a comment. `python tools/build.py sdk check` holds it to the repository,
# `sdk install` installs a group of it, and tools/build.cfg says how. A system line names what is checked and never
# installed; its version column is the group that needs it.

# Rust. The first rust line is the default toolchain: an exact stable, the newest the repository has been tested on.
# The second is the minimum, Cargo.toml's rust-version.
core rustup-init 1.29.2 windows-x64 00f139da614dced87d3c3d4121c43eebdac3c1bf8a5ee86b9d80dfd71c8d70fd https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-pc-windows-msvc/rustup-init.exe
core rustup-init 1.29.2 windows-arm64 58005a321c5dcb9c4457c0a13bb5d6a56a5793efaef429004edaa1db33019b59 https://static.rust-lang.org/rustup/archive/1.29.2/aarch64-pc-windows-msvc/rustup-init.exe
core rustup-init 1.29.2 linux-x64 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4 https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
core rustup-init 1.29.2 linux-arm64 a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697 https://static.rust-lang.org/rustup/archive/1.29.2/aarch64-unknown-linux-gnu/rustup-init
core rustup-init 1.29.2 macos-arm64 f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9 https://static.rust-lang.org/rustup/archive/1.29.2/aarch64-apple-darwin/rustup-init
core rustup-init 1.29.2 macos-x64 b9610730ddeef52765723847866fd1e3540b2bf7d5ab0c324aa143a5edf25ba0 https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-apple-darwin/rustup-init
core rust 1.98.1 any - -
core rust 1.89.0 any - -
core rust-component clippy any - -
core rust-component rustfmt any - -

# The web app's Noise method is WebAssembly: the target is rustup's. The command line that links it is built from the deps
# branch's crates-wasm-bindgen-cli/ by app/tool/build_noise.py --install-bindgen, never from crates.io.
app rust-target wasm32-unknown-unknown any - -
app wasm-bindgen-cli 0.2.130 any - -

# Flutter: the commit of Boriken-Dev/flutter (the scanner-clean mirror of flutter/flutter), what `flutter --version`
# reports there, the engine whose files are the assets of the mirror's release engine-<hash>, and the Dart it carries.
# tools/flutter.pin states the first three too and build.cfg holds the two to each other.
app flutter 33d7f282aaef7665096e5acd368d3c2ee226f6bb any - https://github.com/Boriken-Dev/flutter.git
app flutter-version 3.51.0-1.0.pre-291 any - -
app flutter-engine 89573e968cbf3febdf4f07189cc2bef6cbef830b any - -
app dart 3.15.0-173.0.dev any - -

