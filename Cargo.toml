[workspace]
resolver = "3"
members = ["crates/canoa", "crates/canoa-ffi", "crates/canoa-host"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/canoa"

[workspace.dependencies]
# The command line.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# canoa.cfg: typed through serde, its entries kept in the document's order.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }
indexmap = { version = "2", default-features = false, features = ["std", "serde"] }
# ACP messages a client sends, read to keep a program launch from reaching the agent.
serde_json = "1"
# The web app's server: requests parsed by tungstenite's own parser, request paths percent-decoded by url's, TLS by
# coqui-web-channel's rustls; each already in the graph at these versions.
httparse = { version = "1.10", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Diagnostics; the subscriber is the binary's.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
# Reading overlays: the Agent Overlay Specification, one implementation shared with the other consumers. Not published yet.
coqui-aos = { git = "https://github.com/Boriken-Dev/coqui-aos", rev = "6c476c4553c9b195502cb505a89d50e27cb85afd" }
# The stdio relay and the provider facade, on coqui-acp at one revision. Not published yet.
coqui-acp = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1" }
coqui-acp-api = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1" }
coqui-acp-bridge = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1" }
coqui-acp-provider = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1" }
# Claude Code and Codex as ACP agents, run in this process with no Node: their translators and what they share.
coqui-acp-claude = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1" }
coqui-acp-codex = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1" }
coqui-acp-harness = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "953c43e2f168b529c38cc2144ae60f674e7d19d1", features = ["antigravity", "kind"] }
# The revisions coqui-acp-bridge builds on at that commit, so the graph holds one of each.
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "2966a25c956678e44e23faf3757d2b34c6a769f3" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681" }
# The Noise method, for the example that plays the page's peer; the revision coqui-acp-bridge builds on.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "3a5b30689780a6e6291af565ff6abbaae515973c", features = ["pin"] }
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel.git", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca", default-features = false, features = ["websocket"] }
# Loading a provider library; the revision coqui-acp-provider's kinds are built on.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", features = ["provider", "load"] }
# A provider's settings, as JSON, made a Guatiao value: only the adapter, no text format.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", default-features = false }

# coqui-acp-bridge takes coqui-peer-tls from crates.io, which names the released coqui-peer: one PeerId type across the graph
# needs the one source coqui-acp patches it to.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# The published coqui-peer-tls still names coqui-peer's old field; this commit follows it.
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d" }
