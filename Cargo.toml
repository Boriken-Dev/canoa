[workspace]
resolver = "3"
members = ["crates/canoa", "crates/canoa-ffi", "crates/canoa-host", "crates/canoa-launch"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/canoa"

[workspace.dependencies]
# The command line.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# canoa.cfg: typed through serde, its entries kept in the document's order.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }
indexmap = { version = "2", default-features = false, features = ["std", "serde"] }
# ACP messages a client sends, read to keep a program launch from reaching the agent.
serde_json = "1"
# The web app's server: requests parsed by tungstenite's own parser, request paths percent-decoded by url's, TLS by
# coqui-transport-web's rustls; each already in the graph at these versions.
httparse = { version = "1.10", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Downloads of the programs a store installs: a blocking client, TLS by rustls with ring and, by default, the operating system's certificate
# verifier (so a TLS-intercepting proxy the system trusts works); webpki's roots stay a choice.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
# Archives a store unpacks: tar and gzip for Codex and Node, zip for Node on Windows; deflate by flate2's pure Rust backend.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Diagnostics; the subscriber is the binary's.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
# Reading overlays: the Agent Overlay Specification, one implementation shared with the other consumers. Not published yet.
coqui-aos = { git = "https://github.com/Boriken-Dev/coqui-aos", rev = "6c476c4553c9b195502cb505a89d50e27cb85afd" }
# The stdio relay and the provider facade, on coqui-acp at one revision. Not published yet.
coqui-acp = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
coqui-acp-api = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
coqui-acp-bridge = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
coqui-acp-provider = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
# Claude Code, Codex and Pi as ACP agents, run in this process with no Node: their translators and what they share.
coqui-acp-claude = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
coqui-acp-codex = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
coqui-acp-pi = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a" }
coqui-acp-harness = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ad1cef39b068a38ed4775cbc73e3eea94283637a", features = ["antigravity", "kind"] }
# The revisions coqui-acp-bridge builds on at that commit, so the graph holds one of each.
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "8dad1766ba1b925f2bee9ebd403805e42e6afc47" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# Windows named pipes and Unix sockets, which a host entry may listen on; built on this tree's coqui-peer and coqui-builder.
coqui-transport-pipe = { git = "https://github.com/Boriken-Dev/coqui-transport-pipe", rev = "1bf161f4d9349e9821d384859d3acdfb58aeae94" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681" }
# The Noise method, for the example that plays the page's peer; the revision coqui-acp-bridge builds on.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "3a5b30689780a6e6291af565ff6abbaae515973c", features = ["pin"] }
# The error a listener's builder returns; the revision the transport crates build on.
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad" }
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "1283116a22de6a8918faa3d0ebd78b8b6777ff0a", default-features = false }
# The WebSocket driver the host serves and dials with.
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "c8df84264ff8e60907f5cedf269104e91d5add22", default-features = false, features = ["websocket"] }
# Loading a provider library; the revision coqui-acp-provider's kinds are built on.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", features = ["provider", "load"] }
# A provider's settings, as JSON, made a Guatiao value: only the adapter, no text format.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", default-features = false }

# coqui-acp-bridge takes coqui-peer-tls from crates.io, which names the released coqui-peer: one PeerId type across the graph
# needs the one source coqui-acp patches it to.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# The published coqui-peer-tls still names coqui-peer's old field; this commit follows it.
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d" }
