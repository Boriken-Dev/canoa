[workspace]
resolver = "3"
members = ["crates/canoa", "crates/canoa-ffi", "crates/canoa-host"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/canoa"

[workspace.dependencies]
# The command line.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# canoa.cfg: typed through serde, its entries kept in the document's order.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }
indexmap = { version = "2", default-features = false, features = ["std", "serde"] }
# ACP messages a client sends, read to keep a program launch from reaching the agent.
serde_json = "1"
# The web app's server: requests parsed by tungstenite's own parser, request paths percent-decoded by url's, TLS by
# coqui-web's rustls; each already in the graph at these versions.
httparse = { version = "1.10", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Diagnostics; the subscriber is the binary's.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
# The stdio relay and the provider facade, on coqui-acp at one revision. Not published yet.
coqui-acp = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "f770997fe43b6ed4b5bbee127e3b1de802b1427d" }
coqui-acp-bridge = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "f770997fe43b6ed4b5bbee127e3b1de802b1427d" }
coqui-acp-provider = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "f770997fe43b6ed4b5bbee127e3b1de802b1427d" }
# Claude Code and Codex as ACP agents, run in this process with no Node: their translators and what they share.
coqui-acp-claude = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "f770997fe43b6ed4b5bbee127e3b1de802b1427d" }
coqui-acp-codex = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "f770997fe43b6ed4b5bbee127e3b1de802b1427d" }
coqui-acp-harness = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "f770997fe43b6ed4b5bbee127e3b1de802b1427d" }
# The revisions coqui-acp-bridge builds on at that commit, so the graph holds one of each.
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "9b1fee4aa12969d7e070182ebc820ca7593fdc17" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a3776fba131415d006f68ea493120fd7f894244a" }
coqui-web = { git = "https://github.com/Boriken-Dev/coqui-web", rev = "445007acb04f1b11f8f0f7c9fcf104f694189a2b", default-features = false, features = ["websocket"] }
# Loading a provider library; the revision coqui-acp-provider's kinds are built on.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "266baf9c9e0c4e03bedf8a830d8e434279f83b94", features = ["provider", "load"] }
# A provider's settings, as JSON, made a Guatiao value: only the adapter, no text format.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "266baf9c9e0c4e03bedf8a830d8e434279f83b94", default-features = false }

# coqui-acp-bridge takes coqui-peer-tls from crates.io, which names the released coqui-peer: one PeerId type across the graph
# needs the one source coqui-acp patches it to.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "1f00bfe6319f64e7ec038a7003746f4f031d538c" }
