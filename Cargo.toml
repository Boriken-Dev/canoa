[workspace]
resolver = "3"
members = ["crates/canoa", "crates/canoa-ffi", "crates/canoa-host"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/canoa"

[workspace.dependencies]
# The command line.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# canoa.cfg: typed through serde, its entries kept in the document's order.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }
indexmap = { version = "2", default-features = false, features = ["std", "serde"] }
# ACP messages a client sends, read to keep a program launch from reaching the agent.
serde_json = "1"
# The web app's server: requests parsed by tungstenite's own parser, request paths percent-decoded by url's, TLS by
# coqui-web-channel's rustls; each already in the graph at these versions.
httparse = { version = "1.10", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Diagnostics; the subscriber is the binary's.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
# The stdio relay and the provider facade, on coqui-acp at one revision. Not published yet.
coqui-acp = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "b1bbd1ac316ccabcb946d713d854579434036f1e" }
coqui-acp-bridge = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "b1bbd1ac316ccabcb946d713d854579434036f1e" }
coqui-acp-provider = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "b1bbd1ac316ccabcb946d713d854579434036f1e" }
# Claude Code and Codex as ACP agents, run in this process with no Node: their translators and what they share.
coqui-acp-claude = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "b1bbd1ac316ccabcb946d713d854579434036f1e" }
coqui-acp-codex = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "b1bbd1ac316ccabcb946d713d854579434036f1e" }
coqui-acp-harness = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "b1bbd1ac316ccabcb946d713d854579434036f1e" }
# The revisions coqui-acp-bridge builds on at that commit, so the graph holds one of each.
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "3cd5e04cfc7bc5d7a976a9e85d8eb808662db997" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "b6aa1f47ca956578ffcd20f936c43e8663ed059a" }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "a491a0034e0a9084c7aa3a5298f3b3c649ae7941" }
coqui-web-channel = { git = "https://github.com/Boriken-Dev/coqui-web-channel.git", rev = "0b5b05c9af3417f6b13edc0fc7d9c86c02a63eca", default-features = false, features = ["websocket"] }
# Loading a provider library; the revision coqui-acp-provider's kinds are built on.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "fe9efd3797ec5e178e1f9381db0e65146d2c866e", features = ["provider", "load"] }
# A provider's settings, as JSON, made a Guatiao value: only the adapter, no text format.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "fe9efd3797ec5e178e1f9381db0e65146d2c866e", default-features = false }

# coqui-acp-bridge takes coqui-peer-tls from crates.io, which names the released coqui-peer: one PeerId type across the graph
# needs the one source coqui-acp patches it to.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "b6aa1f47ca956578ffcd20f936c43e8663ed059a" }
# The published coqui-peer-tls still names coqui-peer's old field; this commit follows it.
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "50bd7ffc6ee75e9fdf1838d5668cfdbd07f286d1" }
