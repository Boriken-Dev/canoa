[workspace]
resolver = "3"
members = ["crates/canoa", "crates/canoa-ffi", "crates/canoa-host", "crates/canoa-launch", "extensions/canoa-antigravity", "extensions/canoa-bitwarden", "extensions/canoa-claude", "extensions/canoa-codex", "extensions/canoa-foundry", "extensions/canoa-git-bash", "extensions/canoa-grok", "extensions/canoa-litellm", "extensions/canoa-microsoft-mail", "extensions/canoa-node", "extensions/canoa-office", "extensions/canoa-openai", "extensions/canoa-opencode", "extensions/canoa-pi", "extensions/canoa-piper", "extensions/canoa-powershell", "extensions/canoa-python", "extensions/canoa-whisper"]

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/canoa"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[workspace.dependencies]
# The command line.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# canoa.cfg: typed through serde, its entries kept in the document's order.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "display", "preserve_order"] }
# canoa.cfg in TOML edited in place: one table changed, and the person's comments, order and spelling of the rest kept.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# canoa.cfg in any format its first line names: found, layered and read through anycfg, which is not published yet.
anycfg = { git = "https://github.com/jose-pr/anycfg-rs", rev = "bf71f7097a550037972a0651e8bd35747b8dcd11" }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
indexmap = { version = "2", default-features = false, features = ["std", "serde"] }
# ACP messages a client sends, read to keep a program launch from reaching the agent.
serde_json = "1"
# The portal's sign-in: the operating system's accounts through PAM and NSS (`canoa portal`, feature `portal`).
coqui-access = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
coqui-access-system = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
# A certificate's claims tied to a directory account by rules (the portal's `matcher`).
coqui-access-kit = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
# Which methods a sign-in may use, from where, and what it still needs.
coqui-access-signin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
# A forwarded certificate's subject and fingerprint, shown when it is enrolled.
coqui-peer-tls = { version = "=0.0.0-alpha.1", default-features = false, features = ["fields"] }
# The portal's one-time codes are a library it loads from a path too (its tests build it); the QR code of a setup link, as an inline
# SVG with no image codecs.
coqui-access-totp-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
# The password and certificate providers are libraries the portal loads from a path (its tests build them).
coqui-access-mtls-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
coqui-access-password-plugin = { git = "https://github.com/Boriken-Dev/coqui-access", rev = "35986e115d0214db7e4885d6a7976e0d771edb9b" }
# Foundry Local's Rust SDK (`canoa-foundry` feature `sdk`).
foundry-local-sdk = "2.4"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync"] }
# HTTP request parsing and percent-decoding for the loopback server and API-gateway helpers.
httparse = { version = "1.10", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }
# TLS for the web app's server (`coqui-transport-web`); already in the graph at this version.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The blocking HTTP client every fetch uses. It has no TLS of its own: coqui-syshttp makes each connection, through the system's proxy and
# with the operating system's certificate verifier and client certificates.
ureq = { version = "3.5", default-features = false }
# The system's proxy (PAC, WPAD), proxy login, certificate verifier and client certificates, and the proxy variables of a child process.
coqui-syshttp = { git = "https://github.com/Boriken-Dev/coqui-syshttp", rev = "5d1e1e3bad78b30f4edf7c4c22478a5bdfe481bd", default-features = false, features = ["pac", "ureq", "pkcs11"] }
# Archives a store unpacks: tar and gzip for Codex and Node, zip for Node on Windows; deflate by flate2's pure Rust backend.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Diagnostics; the subscriber is the binary's.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
# The destination patterns of a profile's proxy item (a regular expression matched whole); already in the graph.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# Reading overlays: the Agent Overlay Specification, one implementation shared with the other consumers. Not published yet.
coqui-aos = { git = "https://github.com/Boriken-Dev/coqui-aos", rev = "9d473be5084684109790f24837eec0d596b1f8f3" }
# The stdio relay and the provider facade, on coqui-acp at one revision. Not published yet.
coqui-acp = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
coqui-acp-api = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
coqui-acp-bridge = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
coqui-acp-provider = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
# Claude Code, Codex and Pi as ACP agents, run in this process with no Node: their translators and what they share.
coqui-acp-claude = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e", features = ["history"] }
coqui-acp-codex = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e", features = ["history"] }
# The session-history format: the recorder, the reader and the loss report.
coqui-acp-history = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
# The host side of secret prompts: the tools an agent is served and what the person is asked.
coqui-acp-secrets = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
coqui-acp-pi = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e", features = ["history"] }
coqui-acp-hub = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e" }
coqui-acp-harness = { git = "https://github.com/Boriken-Dev/coqui-acp", rev = "ba64f35eb5f9a436e3f2670380ae31f2c3b9e07e", features = ["antigravity", "kind"] }
# The revisions the bridge library (coqui-acp-bridge) builds on at that commit, so the graph holds one of each. The link (proof, pairing, streams,
# peers, `tcp/1`) is coqui-link's; coqui-agentic-peer keeps the home, discovery, the companion and MCP offers.
coqui-link = { git = "https://github.com/Boriken-Dev/coqui-link", rev = "40123baab01440c0522a27baa7321a31892b3735", features = ["sealed", "forward"] }
coqui-agentic-peer = { git = "https://github.com/Boriken-Dev/coqui-agentic-peer", rev = "161307f9ebc216a56e21d7407688baa80f442823" }
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# Windows named pipes and Unix sockets, which a host entry may listen on; built on this tree's coqui-peer and coqui-builder.
coqui-transport-pipe = { git = "https://github.com/Boriken-Dev/coqui-transport-pipe", rev = "76d97671d87372be5d29263a98198a08fea5eaed" }
# The `transport` kind: an entry may name a transport provider by id (built-in pipe and websocket, or one a library or source loads).
coqui-transport-guatiao = { git = "https://github.com/Boriken-Dev/coqui-transport-guatiao", rev = "4dc07e03893c693a70d711df6d475b65c595e0e3", features = ["pipe", "websocket"] }
coqui-peer-webcrypto = { git = "https://github.com/Boriken-Dev/coqui-peer-webcrypto", rev = "9146f55dd9fb9be8d6d96f43e17bc7a057ba0681" }
# The Noise method, for the example that plays the page's peer; the revision the bridge library (coqui-acp-bridge) builds on.
coqui-peer-noise = { git = "https://github.com/Boriken-Dev/coqui-peer-noise", rev = "3a5b30689780a6e6291af565ff6abbaae515973c", features = ["pin"] }
# The error a listener's builder returns; the revision the transport crates build on.
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad" }
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "2601da58de9cac8f635060e4746864e9b238c6c5", default-features = false }
# The WebSocket driver the host serves and dials with.
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "5b126cd5ac9dfe48194aaf9ceb5ef09e23494e23", default-features = false, features = ["websocket"] }
# A2A tasks on a link and in process: the host's delegation agent and its task store. On the revisions of coqui-link and coqui-transport above.
coqui-a2a = { git = "https://github.com/Boriken-Dev/coqui-a2a", rev = "e1d6216467190043a622069c9879e399d760dad4", default-features = false, features = ["tasks"] }
# Loading a provider library; the revision coqui-acp-provider's kinds are built on.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d", features = ["provider", "load"] }
# A provider's settings, as JSON, made a Guatiao value: only the adapter, no text format.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d", default-features = false }
# Libraries written in JavaScript, run by QuickJS built into the host: the source, what it is built on and the call mechanism it needs.
guatiao-source-js = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d" }
guatiao-bridge = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d", features = ["json"] }
guatiao-libffi = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d" }
# Schema and form metadata for providers, settings, profile items, and accounts.
guatiao-intake = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d", default-features = false, features = ["derive"] }

# Crates the member crates share.
# Pre-1.0 Windows and binary inspection crates pinned for platform OS integration (registry, ACLs, Job Objects, elevation, dialogs, PE imports).
tungstenite = { version = "0.30", default-features = false }
getrandom = "0.4"
url = "2.5"
data-encoding = { version = "2", default-features = false, features = ["std"] }
subtle = { version = "2", default-features = false }
keyring-core = "1"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
zeroize = "1"
time = { version = "0.3", default-features = false, features = ["parsing"] }
rpassword = "7"
sha2 = { version = "0.11", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["std"] }
# This computer's addresses, for what the host says of itself to a browser; already in the graph through mdns-sd.
if-addrs = "0.15"
libc = "0.2"
windows-sys = "0.61"
zbus-secret-service-keyring-store = "1"
apple-native-keyring-store = "1"
windows-native-keyring-store = "1"
windows-registry = "0.6"
win32job = "2.0.3"
is_elevated = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The roots the operating system trusts, as a program that reads a CA file is given them beside the session proxy's authority; already in the graph.
rustls-native-certs = "0.8"
windows-permissions = "0.2"
win-msgbox = "0.2"
# The COM add-in for classic desktop Office: the interfaces Office calls and the controls it hosts, in a DLL.
windows = "0.62"
# The macros of the `windows` crate name this crate in what they write.
windows-core = "0.62"
object = { version = "0.41", default-features = false, features = ["read_core", "pe", "std"] }
# The member crates themselves.
canoa = { path = "crates/canoa" }
canoa-host = { path = "crates/canoa-host" }
canoa-antigravity = { path = "extensions/canoa-antigravity" }
canoa-bitwarden = { path = "extensions/canoa-bitwarden" }
canoa-claude = { path = "extensions/canoa-claude" }
canoa-foundry = { path = "extensions/canoa-foundry" }
canoa-codex = { path = "extensions/canoa-codex" }
canoa-git-bash = { path = "extensions/canoa-git-bash" }
canoa-grok = { path = "extensions/canoa-grok" }
canoa-litellm = { path = "extensions/canoa-litellm" }
canoa-node = { path = "extensions/canoa-node" }
canoa-microsoft-mail = { path = "extensions/canoa-microsoft-mail" }
canoa-office = { path = "extensions/canoa-office" }
canoa-openai = { path = "extensions/canoa-openai" }
canoa-opencode = { path = "extensions/canoa-opencode" }
canoa-pi = { path = "extensions/canoa-pi" }
canoa-powershell = { path = "extensions/canoa-powershell" }
canoa-python = { path = "extensions/canoa-python" }
canoa-whisper = { path = "extensions/canoa-whisper" }
canoa-piper = { path = "extensions/canoa-piper" }

# The bridge library (coqui-acp-bridge) takes coqui-peer-tls from crates.io, which names the released coqui-peer: one PeerId type across the graph
# needs the one source coqui-acp patches it to.
[patch.crates-io]
coqui-peer = { git = "https://github.com/Boriken-Dev/coqui-peer", rev = "984db3d54b73de10c7892b06fe269a259de2d1c5" }
# The published coqui-peer-tls still names coqui-peer's old field; this commit follows it.
coqui-peer-tls = { git = "https://github.com/Boriken-Dev/coqui-peer-tls", rev = "7cbd7ee208595c055d74eed79a4dafcd0175883d" }
# coqui-access takes coqui-net-acl from this commit and the bridge library (coqui-acp-bridge) from crates.io: one source, so the offline mirror
# holds one copy.
coqui-net-acl = { git = "https://github.com/Boriken-Dev/coqui-net-acl", rev = "839435acc29b76ec0190b7099f870863313d3fcd" }
